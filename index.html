<!DOCTYPE html>
<html lang="uz">
<head>

  <title>BilimXona — Test va Imtihon Platformasi</title>

  <style>
    * { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg-obsidian: #030508;
      --bg-midnight: #060911;
      --center-blue-glow: rgba(37, 99, 235, 0.24);
      --surface-card: linear-gradient(155deg, rgba(12, 19, 36, 0.96) 0%, rgba(6, 10, 19, 0.98) 100%);
      --border-subtle: rgba(148, 163, 184, 0.16);
      --text-primary: #e8f1ff;
      --lemon-soft: #d9f99d;
      color-scheme: dark;
    }
    body.soft-day-mode {
      --bg-obsidian: #151d30;
      --bg-midnight: #0f1625;
      --center-blue-glow: rgba(59, 130, 246, 0.24);
      --surface-card: linear-gradient(155deg, rgba(27, 38, 60, 0.96) 0%, rgba(19, 28, 46, 0.98) 100%);
      --border-subtle: rgba(190, 242, 100, 0.24);
      --text-primary: #edf4ff;
    }
    body {
      background-color: var(--bg-obsidian);
      background-image:
        radial-gradient(circle at 50% 22%, var(--center-blue-glow) 0%, rgba(15, 23, 42, 0.14) 38%, rgba(3, 5, 8, 0.98) 76%),
        linear-gradient(180deg, var(--bg-obsidian) 0%, var(--bg-midnight) 100%);
      background-attachment: fixed;
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 6rem;
    }
    @media (min-width: 640px) { body { padding-bottom: 3rem; } }
    .hidden { display: none !important; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .main-menu-shell {
      background: linear-gradient(90deg, rgba(124, 45, 18, 0.92) 0%, rgba(14, 116, 144, 0.92) 22%, rgba(29, 78, 216, 0.98) 50%, rgba(67, 56, 202, 0.94) 78%, rgba(6, 95, 70, 0.92) 100%);
      border-bottom: 1px solid rgba(190, 242, 100, 0.28);
      box-shadow: 0 12px 34px rgba(2, 6, 23, 0.8), 0 0 46px rgba(37, 99, 235, 0.28);
      backdrop-filter: blur(12px);
    }
    .app-card {
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      box-shadow: 0 16px 36px rgba(2, 6, 23, 0.68), inset 0 1px 0 rgba(190, 242, 100, 0.08);
      border-radius: 1.5rem;
    }
    .lemon-title { color: var(--lemon-soft); text-shadow: 0 0 18px rgba(163, 230, 53, 0.16); }
    .lemon-btn {
      background: linear-gradient(135deg, #d9f99d 0%, #bef264 45%, #a3e635 85%, #84cc16 100%);
      color: #071105;
      border: 1px solid rgba(217, 249, 157, 0.72);
      box-shadow: 0 6px 20px rgba(132, 204, 22, 0.26);
      transition: transform 0.14s ease, filter 0.16s ease, opacity 0.16s ease;
      cursor: pointer;
    }
    .lemon-btn:hover:not(:disabled) { filter: brightness(1.06); }
    .lemon-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .tactile-btn { transition: transform 0.14s ease, background-color 0.16s ease, border-color 0.16s ease; cursor: pointer; }
    .tactile-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .lemon-btn:active:not(:disabled), .tactile-btn:active:not(:disabled) { transform: scale(0.96); }
    .lemon-pill { background: rgba(163, 230, 53, 0.14); color: #d9f99d; border: 1px solid rgba(190, 242, 100, 0.35); }
    .bottom-sheet-panel {
      background: linear-gradient(180deg, #0d1629 0%, #060911 100%);
      border: 1px solid rgba(190, 242, 100, 0.26);
      box-shadow: 0 -14px 45px rgba(0, 0, 0, 0.85), 0 0 42px rgba(29, 78, 216, 0.24);
    }
    .field {
      width: 100%; padding: 0.65rem 0.875rem; border-radius: 0.75rem;
      background: #0b1220; border: 1px solid #334155; color: #e8f1ff;
      font-size: 0.8rem; outline: none; transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .field:focus { border-color: #a3e635; box-shadow: 0 0 0 3px rgba(163, 230, 53, 0.12); }
    .field::placeholder { color: #64748b; }
    .field:disabled { opacity: 0.5; }
    textarea.field { resize: vertical; }
    .opt-btn { transition: transform 0.14s ease, border-color 0.15s ease, background-color 0.15s ease; cursor: pointer; }
    .opt-btn:hover:not(:disabled) { border-color: rgba(190, 242, 100, 0.55); transform: translateY(-1px); }
    .opt-btn:disabled { cursor: default; }
    .spinner {
      width: 14px; height: 14px; border-radius: 9999px; display: inline-block;
      border: 2px solid rgba(7, 17, 5, 0.25); border-top-color: #071105;
      animation: spin 0.7s linear infinite; vertical-align: -2px;
    }
    .spinner-lime { border-color: rgba(190, 242, 100, 0.3); border-top-color: #bef264; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .ring { width: 132px; height: 132px; border-radius: 9999px; display: grid; place-items: center; }
    .ring-inner { width: 104px; height: 104px; border-radius: 9999px; background: #060911; display: grid; place-items: center; }
    input[type="checkbox"], input[type="radio"] { accent-color: #a3e635; }
    :focus-visible { outline: 2px solid #a3e635; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <noscript><div style="padding:24px;color:#e8f1ff;background:#030508;font-family:sans-serif">Bu sayt ishlashi uchun JavaScript yoqilgan bo'lishi kerak.</div></noscript>

  <div class="min-h-screen flex flex-col justify-between">
    <div>
      <header class="main-menu-shell sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-3 sm:px-6 py-3 space-y-2.5">
          <div class="flex flex-wrap items-center justify-between gap-2.5">
            <button type="button" data-act="nav" data-view="quiz" class="tactile-btn flex items-center gap-2.5 text-left" aria-label="Bosh sahifa">
              <span class="w-11 h-11 rounded-2xl bg-slate-950/90 border border-lime-300/45 flex items-center justify-center text-2xl shadow-lg" aria-hidden="true">🛡️</span>
              <span>
                <span class="block text-lg sm:text-xl font-black lemon-title tracking-tight leading-tight">BilimXona</span>
                <span id="session-banner" class="block text-[11px] text-slate-200/90 font-semibold">Ulanmoqda...</span>
              </span>
            </button>
            <div class="flex flex-wrap items-center gap-1.5 sm:gap-2">
              <span id="exam-pill" class="hidden px-2.5 py-1.5 rounded-xl bg-amber-950/90 text-amber-200 border border-amber-400/45 text-[11px] font-black tabular-nums">⏱️ 00:00</span>
              <span id="network-pill" class="px-2.5 py-1.5 rounded-xl bg-slate-950/80 text-sky-200 border border-sky-300/30 text-[11px] font-extrabold">🌐</span>
              <button type="button" id="auth-btn" data-act="auth" class="lemon-btn px-3 py-1.5 rounded-xl text-xs font-black">🔐 Kirish</button>
              <button type="button" data-act="theme" class="tactile-btn px-3 py-1.5 rounded-xl bg-slate-950/85 hover:bg-slate-900 text-lime-300 border border-lime-300/35 text-xs font-extrabold" aria-label="Rejimni almashtirish">🌓</button>
            </div>
          </div>
          <nav id="top-nav" aria-label="Asosiy bo'limlar" class="flex items-center gap-1.5 sm:gap-2 overflow-x-auto no-scrollbar pb-0.5"></nav>
        </div>
      </header>

      <main id="view" class="max-w-6xl mx-auto px-3 sm:px-6 py-5 space-y-5"></main>
    </div>

    <nav aria-label="Tezkor navigatsiya" class="fixed bottom-0 inset-x-0 z-40 bg-slate-950/95 backdrop-blur-md border-t border-lime-300/20 px-2 py-1.5 sm:hidden">
      <div id="dock" class="grid grid-cols-4 gap-1 max-w-md mx-auto"></div>
    </nav>

    <footer class="mt-12 py-6 px-4 text-xs text-slate-400 border-t border-slate-800">
      <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
        <div><strong class="lemon-title">BilimXona</strong> — onlayn test va imtihon</div>
        <div class="text-[11px] text-lime-300/85 font-semibold">Javoblar serverda tekshiriladi</div>
      </div>
    </footer>
  </div>

  <div id="toasts" class="fixed top-24 right-3 sm:right-6 z-[60] flex flex-col gap-2 max-w-sm pointer-events-none" aria-live="polite"></div>

  <!-- Tasdiqlash oynasi -->
  <div id="confirm-modal" class="fixed inset-0 z-[55] hidden items-center justify-center bg-slate-950/85 backdrop-blur-sm p-4" role="dialog" aria-modal="true">
    <div class="bottom-sheet-panel w-full max-w-md rounded-3xl p-5 space-y-4">
      <div class="text-base font-black lemon-title" id="confirm-title">Tasdiqlash</div>
      <p class="text-xs text-slate-300 leading-relaxed" id="confirm-text"></p>
      <div class="flex justify-end gap-2">
        <button type="button" id="confirm-no" class="tactile-btn px-4 py-2 rounded-xl bg-slate-900 text-slate-200 border border-slate-700 text-xs font-black">Bekor qilish</button>
        <button type="button" id="confirm-yes" class="tactile-btn px-4 py-2 rounded-xl bg-rose-600 text-slate-100 border border-rose-400/50 text-xs font-black">Ha</button>
      </div>
    </div>
  </div>

  <!-- Kirish sheet -->
  <div id="auth-sheet" class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center bg-slate-950/85 backdrop-blur-sm p-0 sm:p-4" role="dialog" aria-modal="true" aria-label="Kirish">
    <div class="bottom-sheet-panel w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-5 sm:p-6 max-h-[92vh] overflow-y-auto space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h2 class="text-lg font-black lemon-title">Akkaunt</h2>
        <button type="button" data-act="auth-close" class="tactile-btn px-3 py-1.5 rounded-xl bg-slate-900 text-lime-300 border border-slate-700 text-xs font-black" aria-label="Yopish">✕</button>
      </div>

      <form id="login-form" data-form="login" class="space-y-3">
        <input id="login-email" name="email" type="email" required autocomplete="email" placeholder="Email" class="field" />
        <input id="login-password" name="password" type="password" required minlength="6" autocomplete="current-password" placeholder="Parol (kamida 6 belgi)" class="field" />
        <div class="flex flex-wrap gap-2">
          <button type="submit" id="login-btn" class="lemon-btn flex-1 min-w-[120px] py-2.5 rounded-xl text-xs font-black">✅ Kirish</button>
          <button type="button" id="signup-btn" data-act="signup" class="tactile-btn flex-1 min-w-[140px] py-2.5 rounded-xl bg-slate-900 text-lime-300 border border-lime-300/35 text-xs font-black">📝 Ro'yxatdan o'tish</button>
        </div>
        <button type="button" data-act="reset" class="text-[11px] font-bold text-sky-300 underline underline-offset-2">Parolni unutdingizmi?</button>
        <div id="auth-hint" class="text-[11px] min-h-[16px] font-bold"></div>
      </form>

      <div id="logged-box" class="hidden space-y-3">
        <div class="rounded-2xl bg-slate-950/80 border border-slate-800 p-3 text-xs">
          <div class="font-black text-lime-300" id="logged-email">—</div>
          <div class="text-slate-400 mt-1" id="logged-role">—</div>
          <div class="text-[10px] text-slate-500 mt-2 break-all">ID: <span id="logged-id">—</span></div>
        </div>
        <div class="flex gap-2">
          <button type="button" data-act="copy-id" class="tactile-btn flex-1 py-2 rounded-xl bg-slate-900 text-sky-200 border border-slate-700 text-xs font-black">📋 ID ni nusxalash</button>
          <button type="button" data-act="recheck" class="tactile-btn flex-1 py-2 rounded-xl bg-slate-900 text-lime-300 border border-lime-300/35 text-xs font-black">🔄 Admin huquqini tekshirish</button>
        </div>
        <p class="text-[11px] text-slate-400 leading-relaxed">Admin bo'lish uchun Supabase SQL Editor'da: <code class="text-lime-300">insert into public.admins (user_id) values ('ID'); </code> so'ngra "Admin huquqini tekshirish" tugmasini bosing.</p>
        <button type="button" data-act="logout" class="tactile-btn w-full py-2.5 rounded-xl bg-rose-950/80 text-rose-200 border border-rose-500/35 text-xs font-black">Chiqish</button>
      </div>
    </div>
  </div>

  <!-- Savol muharriri (admin, modal) -->
  <div id="editor-sheet" class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center bg-slate-950/85 backdrop-blur-sm p-0 sm:p-4" role="dialog" aria-modal="true" aria-label="Savol muharriri"></div>

  <script>
  (function () {
    'use strict';

    /* ================================================================
     * SOZLAMALAR. Anon (publishable) kalit ochiq bo'lishi mumkin:
     * ma'lumotlar himoyasi RLS va server funksiyalari orqali.
     * service_role kalitni HECH QACHON bu yerga qo'ymang.
     * ================================================================ */
    const SUPABASE_URL = 'https://mfonyhivgisrrgfumrqm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_y1QrN9WVmcLz-1SrFRxliw_q0_w7ixh';
    const PASS_PERCENT = 60;
    const EXAM_SECONDS_PER_QUESTION = 60;
    const MIN_OPTIONS = 2;
    const MAX_OPTIONS = 6;
    const ADMIN_LIST_LIMIT = 200;
    const IDB_NAME = 'bilimxona_app_v4';
    const IDB_STORE = 'runtime_cache';

    /* ---------------- Yordamchilar ---------------- */
    const $ = id => document.getElementById(id);

    function esc(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function safeUrl(u) {
      try {
        const x = new URL(String(u || '').trim());
        return (x.protocol === 'https:' || x.protocol === 'http:') ? x.href : '';
      } catch (_) { return ''; }
    }
    function uuid() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        return (c === 'x' ? r : (r & 3 | 8)).toString(16);
      });
    }
    function shuffleArray(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }
    function fmtClock(sec) {
      sec = Math.max(0, sec | 0);
      return String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
    }
    function fmtDate(iso) {
      try { return new Date(iso).toLocaleString('uz-UZ', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); }
      catch (_) { return ''; }
    }
    function errMsg(e) {
      const raw = (e && (e.message || e.error_description)) || String(e || 'Noma\'lum xatolik');
      if ((e && e.code === '42501') || /forbidden|permission denied|row-level security/i.test(raw)) return 'Ruxsat yo\'q (403): bu amal faqat adminlar uchun yoki tizimga kirish kerak.';
      if (/invalid login credentials/i.test(raw)) return 'Email yoki parol noto\'g\'ri.';
      if (/email not confirmed/i.test(raw)) return 'Email hali tasdiqlanmagan. Pochtangizdagi havolani bosing.';
      if (/user already registered/i.test(raw)) return 'Bu email allaqachon ro\'yxatdan o\'tgan. "Kirish" ni bosing.';
      if (/password should be at least/i.test(raw)) return 'Parol kamida 6 belgi bo\'lishi kerak.';
      if (/failed to fetch|networkerror|load failed/i.test(raw)) return 'Tarmoq xatosi. Internetni tekshiring.';
      if (/savol topilmadi/i.test(raw)) return 'Savol topilmadi. Sahifani yangilang.';
      return raw;
    }

    function notify(text, level) {
      const stack = $('toasts');
      if (!stack) return;
      const styles = {
        success: 'bg-emerald-950/95 text-lime-200 border-lime-300/45',
        error: 'bg-rose-950/95 text-rose-200 border-rose-400/50',
        warn: 'bg-amber-950/95 text-amber-200 border-amber-400/45',
        info: 'bg-blue-950/95 text-lime-200 border-lime-300/35'
      };
      const el = document.createElement('div');
      el.className = 'px-4 py-3 rounded-2xl border text-xs font-extrabold shadow-2xl ' + (styles[level] || styles.info);
      el.textContent = text;
      stack.appendChild(el);
      if (window.gsap) gsap.fromTo(el, { y: -10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.2 });
      setTimeout(() => el.remove(), 3800);
    }

    function askConfirm(text, title) {
      return new Promise(resolve => {
        const modal = $('confirm-modal');
        $('confirm-title').textContent = title || 'Tasdiqlash';
        $('confirm-text').textContent = text;
        modal.classList.remove('hidden'); modal.classList.add('flex');
        const done = v => {
          modal.classList.add('hidden'); modal.classList.remove('flex');
          $('confirm-yes').onclick = null; $('confirm-no').onclick = null;
          resolve(v);
        };
        $('confirm-yes').onclick = () => done(true);
        $('confirm-no').onclick = () => done(false);
      });
    }

    function setAuthHint(msg, isErr) {
      const el = $('auth-hint');
      el.textContent = msg || '';
      el.className = 'text-[11px] min-h-[16px] font-bold ' + (isErr ? 'text-rose-300' : 'text-lime-300');
    }

    /* ---------------- IndexedDB (kesh, localStorage emas) ---------------- */
    let dbPromise = null;
    function openDb() {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((resolve, reject) => {
        if (!('indexedDB' in window)) return reject(new Error('IndexedDB yo\'q'));
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = () => {
          if (!req.result.objectStoreNames.contains(IDB_STORE)) req.result.createObjectStore(IDB_STORE, { keyPath: 'key' });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => { dbPromise = null; reject(req.error); };
      });
      return dbPromise;
    }
    async function idbGet(key) {
      try {
        const db = await openDb();
        return await new Promise(resolve => {
          const r = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).get(key);
          r.onsuccess = () => resolve(r.result ? r.result.value : null);
          r.onerror = () => resolve(null);
        });
      } catch (_) { return null; }
    }
    async function idbSet(key, value) {
      try {
        const db = await openDb();
        await new Promise((resolve, reject) => {
          const r = db.transaction(IDB_STORE, 'readwrite').objectStore(IDB_STORE).put({ key, value, updatedAt: Date.now() });
          r.onsuccess = () => resolve();
          r.onerror = () => reject(r.error);
        });
      } catch (_) { /* kesh ixtiyoriy */ }
    }

    /* ---------------- Holat ---------------- */
    function blankDraft(subjectId, topicId) {
      const opts = [0, 1, 2, 3].map(() => ({ id: uuid(), label: '' }));
      return {
        id: null, subject_id: subjectId || '', topic_id: topicId || '',
        prompt: '', image_url: '', explanation: '', options: opts, correct_answer_id: opts[0].id
      };
    }

    const state = {
      view: 'quiz',
      adminTab: 'dashboard',
      soft: false,
      sb: null,
      session: null,
      userId: null,
      userEmail: '',
      isAdmin: false,
      loading: true,
      statusMessage: 'Ma\'lumotlar yuklanmoqda...',
      subjects: [],
      topics: [],
      questions: [],
      displayOrder: [],
      optCache: {},
      subjectId: '',
      topicId: '',
      shuffle: false,
      idx: 0,
      picks: {},          // mashq: qid -> tanlangan variant (tekshirilmagan)
      answers: {},        // mashq: qid -> { correct, explanation, picked, attempts }
      verifying: false,
      exam: { active: false, ids: [], left: 0, timer: null, startedAt: 0, submitting: false, picks: {} },
      lastExam: null,     // oxirgi imtihon natijasi (xotirada)
      history: null,      // serverdagi urinishlar
      leaderboard: null,
      adminSearch: '',
      editor: null,       // admin: savol formasi (modal) holati
      adminStats: null
    };

    /* ---------------- Katalog ---------------- */
    function normalizeQuestions(rows) {
      return (rows || []).map(q => ({
        id: q.id,
        subject_id: q.subject_id,
        topic_id: q.topic_id || '',
        prompt: q.prompt,
        image_url: q.image_url || '',
        created_at: q.created_at || '',
        options: (q.answers || []).slice()
          .sort((a, b) => (a.position || 0) - (b.position || 0))
          .map(a => ({ id: a.id, label: a.label }))
      }));
    }
    function rebuildOrder() {
      const ids = state.questions.map(q => q.id);
      state.displayOrder = state.shuffle ? shuffleArray(ids) : ids;
      state.optCache = {};
    }
    function optionsFor(q) {
      if (!state.shuffle) return q.options;
      if (!state.optCache[q.id]) state.optCache[q.id] = shuffleArray(q.options);
      return state.optCache[q.id];
    }
    function questionById(id) { return state.questions.find(q => q.id === id) || null; }
    function subjectName(id) { const s = state.subjects.find(x => x.id === id); return s ? s.name : '—'; }
    function topicName(id) { const t = state.topics.find(x => x.id === id); return t ? t.name : ''; }

    function filteredQuestions() {
      const map = new Map(state.questions.map(q => [q.id, q]));
      return state.displayOrder.map(id => map.get(id)).filter(Boolean).filter(q =>
        (!state.subjectId || q.subject_id === state.subjectId) &&
        (!state.topicId || q.topic_id === state.topicId));
    }
    function examList() {
      return state.exam.ids.map(id => questionById(id)).filter(Boolean);
    }
    function currentList() { return state.exam.active ? examList() : filteredQuestions(); }
    function currentQuestion() { return currentList()[state.idx] || null; }
    function clampIdx() {
      const n = currentList().length;
      if (state.idx >= n) state.idx = Math.max(0, n - 1);
      if (state.idx < 0) state.idx = 0;
    }

    async function loadCachedCatalog() {
      const c = await idbGet('catalog_v4');
      if (!c) return false;
      state.subjects = c.subjects || [];
      state.topics = c.topics || [];
      state.questions = c.questions || [];
      rebuildOrder();
      return state.questions.length > 0 || state.subjects.length > 0;
    }

    async function syncCatalog() {
      if (!state.sb) {
        const had = await loadCachedCatalog();
        state.statusMessage = had ? 'Kesh nusxa ko\'rsatilmoqda. Server bilan aloqa yo\'q.' : 'Ma\'lumot yo\'q. Internetni tekshiring.';
        state.loading = false;
        return false;
      }
      state.loading = true;
      try {
        const sb = state.sb;
        const [s, t, q] = await Promise.all([
          sb.from('subjects').select('id,name').order('name'),
          sb.from('topics').select('id,subject_id,name').order('name'),
          sb.from('questions').select('id,subject_id,topic_id,prompt,image_url,created_at,answers(id,label,position)').order('created_at')
        ]);
        const err = s.error || t.error || q.error;
        if (err) throw err;
        state.subjects = s.data || [];
        state.topics = t.data || [];
        state.questions = normalizeQuestions(q.data);
        rebuildOrder();
        await idbSet('catalog_v4', { subjects: state.subjects, topics: state.topics, questions: state.questions });
        state.statusMessage = state.questions.length ? '' : 'Hozircha savollar yo\'q. Admin savol qo\'shishi kerak.';
        return true;
      } catch (e) {
        const had = await loadCachedCatalog();
        state.statusMessage = (had ? 'Kesh nusxa: ' : 'Yuklanmadi: ') + errMsg(e);
        return false;
      } finally {
        state.loading = false;
        clampIdx();
      }
    }

    /* ---------------- Ulanish va autentifikatsiya ---------------- */
    async function initClient() {
      if (state.sb) return true;
      if (!window.supabase || !window.supabase.createClient) {
        notify('Kutubxona yuklanmadi. Internetni tekshiring.', 'error');
        return false;
      }
      try {
        state.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
          auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
        });
        const { data } = await state.sb.auth.getSession();
        await applySession(data && data.session ? data.session : null);
        state.sb.auth.onAuthStateChange((event, session) => {
          setTimeout(() => handleAuthEvent(event, session), 0);
        });
        return true;
      } catch (e) {
        state.sb = null;
        notify('Ulanishda xatolik: ' + errMsg(e), 'error');
        return false;
      }
    }
    async function ensureClient() { return state.sb ? true : initClient(); }

    async function applySession(session) {
      state.session = session || null;
      state.userId = session && session.user ? session.user.id : null;
      state.userEmail = session && session.user ? (session.user.email || '') : '';
      state.isAdmin = false;
      if (state.sb && state.session) {
        try {
          const { data, error } = await state.sb.rpc('is_admin');
          state.isAdmin = !error && data === true;
        } catch (_) { state.isAdmin = false; }
      }
      if (!state.isAdmin && state.view === 'admin') state.view = 'quiz';
    }

    function clearUserState() {
      state.answers = {};
      state.picks = {};
      state.history = null;
      state.leaderboard = null;
      state.lastExam = null;
      stopExam(true);
    }

    async function handleAuthEvent(event, session) {
      try {
        if (event === 'INITIAL_SESSION') return;
        if (event === 'TOKEN_REFRESHED') { state.session = session; return; }
        if (event === 'PASSWORD_RECOVERY') {
          const pw = window.prompt('Yangi parolni kiriting (kamida 6 belgi):');
          if (pw && pw.length >= 6) {
            const { error } = await state.sb.auth.updateUser({ password: pw });
            notify(error ? errMsg(error) : 'Parol yangilandi.', error ? 'error' : 'success');
          }
          return;
        }
        const before = state.userId;
        await applySession(session);
        if (before !== state.userId) clearUserState();
        await syncCatalog();
        renderApp();
      } catch (e) {
        notify(errMsg(e), 'error');
      }
    }

    function openAuth() {
      const s = $('auth-sheet');
      s.classList.remove('hidden'); s.classList.add('flex');
      renderAuthSheet();
    }
    function closeAuth() {
      const s = $('auth-sheet');
      s.classList.add('hidden'); s.classList.remove('flex');
    }
    function renderAuthSheet() {
      const logged = !!state.session;
      $('login-form').classList.toggle('hidden', logged);
      $('logged-box').classList.toggle('hidden', !logged);
      if (logged) {
        $('logged-email').textContent = state.userEmail;
        $('logged-role').textContent = state.isAdmin ? 'Rol: Admin (server tasdiqlagan)' : 'Rol: Foydalanuvchi';
        $('logged-id').textContent = state.userId || '—';
      }
    }

    async function doLogin(form) {
      if (!await ensureClient()) return;
      const email = form.elements.email.value.trim();
      const password = form.elements.password.value;
      setAuthHint('Tekshirilmoqda...', false);
      $('login-btn').disabled = true;
      try {
        const { error } = await state.sb.auth.signInWithPassword({ email, password });
        if (error) { setAuthHint(errMsg(error), true); return; }
        form.reset();
        setAuthHint('', false);
        closeAuth();
        notify('Muvaffaqiyatli kirdingiz.', 'success');
      } finally {
        $('login-btn').disabled = false;
      }
    }

    async function doSignup() {
      if (!await ensureClient()) return;
      const email = $('login-email').value.trim();
      const password = $('login-password').value;
      if (!email || !email.includes('@')) return setAuthHint('To\'g\'ri email kiriting.', true);
      if (password.length < 6) return setAuthHint('Parol kamida 6 belgi bo\'lishi kerak.', true);
      $('signup-btn').disabled = true;
      try {
        const { data, error } = await state.sb.auth.signUp({
          email, password,
          options: { emailRedirectTo: location.origin + location.pathname }
        });
        if (error) return setAuthHint(errMsg(error), true);
        if (data && data.session) {
          $('login-form').reset(); setAuthHint('', false); closeAuth();
          notify('Akkaunt yaratildi va tizimga kirdingiz.', 'success');
        } else {
          setAuthHint('Tasdiqlash xati emailingizga yuborildi. Havolani bosib, so\'ng kiring.', false);
        }
      } finally {
        $('signup-btn').disabled = false;
      }
    }

    async function doReset() {
      if (!await ensureClient()) return;
      const email = $('login-email').value.trim();
      if (!email || !email.includes('@')) return setAuthHint('Avval emailingizni kiriting.', true);
      const { error } = await state.sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
      if (error) return setAuthHint(errMsg(error), true);
      setAuthHint('Parolni tiklash havolasi emailingizga yuborildi.', false);
    }

    async function doLogout() {
      if (!state.sb) return;
      const { error } = await state.sb.auth.signOut();
      if (error) return notify(errMsg(error), 'error');
      closeAuth();
      notify('Tizimdan chiqdingiz.', 'info');
    }

    /* ---------------- Mashq ---------------- */
    function practiceStats() {
      const list = filteredQuestions();
      let correct = 0, wrong = 0;
      list.forEach(q => { const a = state.answers[q.id]; if (a) a.correct ? correct++ : wrong++; });
      return { total: list.length, correct, wrong, left: list.length - correct - wrong };
    }

    function pickAnswer(id) {
      const q = currentQuestion();
      if (!q || state.verifying) return;
      if (state.exam.active) {
        state.exam.picks[q.id] = id;
      } else {
        const done = state.answers[q.id];
        if (done && done.correct) return;
        state.picks[q.id] = id;
      }
      renderApp();
    }

    async function verifyCurrent() {
      const q = currentQuestion();
      if (!q || state.verifying || state.exam.active) return;
      const chosen = state.picks[q.id];
      if (!chosen) return;
      if (!await ensureClient()) return notify('Baza bilan aloqa yo\'q.', 'warn');
      if (!navigator.onLine) return notify('Javobni tekshirish uchun internet kerak.', 'warn');
      state.verifying = true; renderApp();
      try {
        const { data, error } = await state.sb.rpc('verify_answer', { p_question_id: q.id, p_answer_id: chosen });
        if (error) throw error;
        const ok = !!(data && data.correct === true);
        const prev = state.answers[q.id];
        state.answers[q.id] = {
          correct: ok,
          picked: chosen,
          explanation: (data && data.explanation) || '',
          attempts: (prev ? prev.attempts : 0) + 1
        };
        state.history = null;
        notify(ok ? '✅ To\'g\'ri javob!' : '❌ Noto\'g\'ri javob.', ok ? 'success' : 'error');
      } catch (e) {
        notify('Tekshirishda xatolik: ' + errMsg(e), 'error');
      } finally {
        state.verifying = false;
        renderApp();
      }
    }

    function goTo(i) {
      const n = currentList().length;
      if (!n) return;
      state.idx = Math.min(n - 1, Math.max(0, i));
      renderApp();
    }

    /* ---------------- Imtihon ---------------- */
    function startExam() {
      if (!state.session) {
        notify('Imtihon topshirish uchun tizimga kiring.', 'warn');
        return openAuth();
      }
      const list = filteredQuestions();
      if (!list.length) return notify('Bu tanlovda savollar yo\'q.', 'warn');
      stopExam(true);
      state.exam = {
        active: true,
        ids: list.map(q => q.id),
        left: list.length * EXAM_SECONDS_PER_QUESTION,
        timer: setInterval(tickExam, 1000),
        startedAt: Date.now(),
        submitting: false,
        picks: {}
      };
      state.idx = 0;
      state.view = 'quiz';
      notify('⏱️ Imtihon boshlandi. Vaqt: ' + Math.round(state.exam.left / 60) + ' daqiqa.', 'info');
      renderApp();
    }

    function stopExam(silent) {
      if (state.exam.timer) clearInterval(state.exam.timer);
      state.exam.timer = null;
      state.exam.active = false;
      if (!silent) renderApp();
      else updateExamPill();
    }

    function tickExam() {
      if (!state.exam.active) return stopExam(true);
      state.exam.left--;
      updateExamPill();
      if (state.exam.left <= 0) {
        notify('⏰ Vaqt tugadi. Javoblar yuborilmoqda.', 'warn');
        finishExam(true);
      }
    }

    function updateExamPill() {
      const pill = $('exam-pill');
      const t = fmtClock(state.exam.left);
      pill.classList.toggle('hidden', !state.exam.active);
      pill.textContent = '⏱️ ' + t;
      pill.classList.toggle('text-rose-200', state.exam.left <= 60 && state.exam.active);
      document.querySelectorAll('[data-clock]').forEach(el => { el.textContent = t; });
    }

    async function finishExam(auto) {
      const ex = state.exam;
      if (!ex.active || ex.submitting) return;
      const unanswered = ex.ids.filter(id => !ex.picks[id]).length;
      if (!auto && unanswered > 0) {
        const ok = await askConfirm('Javob berilmagan savollar: ' + unanswered + ' ta. Baribir yakunlaysizmi?', 'Imtihonni yakunlash');
        if (!ok) return;
      }
      if (!await ensureClient()) return notify('Baza bilan aloqa yo\'q. Qayta urinib ko\'ring.', 'error');
      ex.submitting = true;
      renderApp();
      try {
        const answered = ex.ids.filter(id => ex.picks[id]);
        const checks = await Promise.all(answered.map(async id => {
          const { data, error } = await state.sb.rpc('verify_answer', { p_question_id: id, p_answer_id: ex.picks[id] });
          if (error) throw error;
          return { id, picked: ex.picks[id], ok: !!(data && data.correct === true), explanation: (data && data.explanation) || '' };
        }));
        const byId = new Map(checks.map(c => [c.id, c]));
        const correct = checks.filter(c => c.ok).length;
        const total = ex.ids.length;
        state.lastExam = {
          total, correct,
          percent: Math.round(correct * 100 / total),
          seconds: Math.round((Date.now() - ex.startedAt) / 1000),
          details: ex.ids.map(id => ({ id, answered: byId.has(id), ok: !!(byId.get(id) && byId.get(id).ok), explanation: byId.get(id) ? byId.get(id).explanation : '' })),
          at: new Date().toISOString()
        };
        stopExam(true);
        if (state.session && state.userId) {
          const { error: saveErr } = await state.sb.from('exams').insert({
            user_id: state.userId,
            subject_id: state.subjectId || null,
            topic_id: state.topicId || null,
            total, correct,
            percent: state.lastExam.percent,
            duration_sec: state.lastExam.seconds
          });
          if (saveErr) notify('Natija saqlanmadi: ' + errMsg(saveErr), 'warn');
          state.leaderboard = null;
        }
        state.history = null;
        state.view = 'results';
        const p = state.lastExam.percent;
        notify('Imtihon yakunlandi: ' + correct + '/' + total + ' (' + p + '%)', p >= PASS_PERCENT ? 'success' : 'warn');
      } catch (e) {
        ex.submitting = false;
        if (auto) { if (ex.timer) clearInterval(ex.timer); ex.timer = null; }
        notify('Yuborishda xatolik: ' + errMsg(e) + '. Qayta urinib ko\'ring.', 'error');
        renderApp();
        return;
      }
      renderApp();
    }

    /* ---------------- Serverdagi tarix ---------------- */
    async function loadHistory() {
      if (!state.sb || !state.session) { state.history = []; return; }
      try {
        const { data, error } = await state.sb.from('attempts')
          .select('question_id,is_correct,created_at')
          .order('created_at', { ascending: false }).limit(500);
        if (error) throw error;
        state.history = data || [];
      } catch (e) {
        state.history = [];
        notify('Tarix yuklanmadi: ' + errMsg(e), 'warn');
      }
      if (state.view === 'results') renderApp();
    }

    async function loadLeaderboard() {
      if (!state.sb) { state.leaderboard = []; return renderApp(); }
      try {
        const { data, error } = await state.sb.rpc('leaderboard', { p_limit: 30 });
        if (error) throw error;
        state.leaderboard = data || [];
      } catch (e) {
        state.leaderboard = [];
        notify('Reyting yuklanmadi: ' + errMsg(e), 'warn');
      }
      if (state.view === 'leaderboard') renderApp();
    }

    async function loadAdminStats() {
      if (!requireAdmin()) return;
      state.adminStats = null;
      try {
        const { data, error } = await state.sb.rpc('admin_stats');
        if (error) throw error;
        state.adminStats = data;
      } catch (e) {
        state.adminStats = { error: errMsg(e) };
      }
      if (state.view === 'admin') renderApp();
    }

    /* ---------------- Navigatsiya ---------------- */
    function navigate(view) {
      if (state.exam.active && view !== 'quiz') {
        return notify('Imtihon davom etmoqda. Avval uni yakunlang.', 'warn');
      }
      state.view = view;
      if (view === 'results' && state.history === null && state.session) loadHistory();
      if (view === 'leaderboard' && state.leaderboard === null) loadLeaderboard();
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function tabs() {
      const t = [
        { id: 'quiz', label: '📝 Test' },
        { id: 'results', label: '📊 Natija' },
        { id: 'leaderboard', label: '🏆 Reyting' }
      ];
      if (state.isAdmin) t.push({ id: 'admin', label: '🛠️ Admin' });
      return t;
    }

    /* ---------------- Render: umumiy ---------------- */
    function renderNav() {
      $('top-nav').innerHTML = tabs().map(t => {
        const on = state.view === t.id;
        return '<button type="button" data-act="nav" data-view="' + t.id + '" class="tactile-btn shrink-0 px-3.5 py-1.5 rounded-xl text-xs font-black border ' +
          (on ? 'lemon-btn' : 'bg-slate-950/80 text-slate-200 border-slate-600/60 hover:bg-slate-900') + '"' + (on ? ' aria-current="page"' : '') + '>' + t.label + '</button>';
      }).join('');
    }

    function renderDock() {
      const items = [
        { view: 'quiz', icon: '📝', label: 'Test' },
        { view: 'results', icon: '📊', label: 'Natija' },
        state.isAdmin
          ? { view: 'admin', icon: '🛠️', label: 'Admin' }
          : { act: 'auth', icon: '🔐', label: state.session ? 'Akkaunt' : 'Kirish' },
        { act: 'theme', icon: '🌓', label: 'Rejim' }
      ];
      $('dock').innerHTML = items.map(i => {
        const on = i.view && state.view === i.view;
        return '<button type="button" data-act="' + (i.view ? 'nav' : i.act) + '"' + (i.view ? ' data-view="' + i.view + '"' : '') +
          ' class="tactile-btn flex flex-col items-center gap-0.5 py-1.5 rounded-xl text-[10px] font-black ' +
          (on ? 'bg-lime-300/20 text-lime-200' : 'text-slate-300 hover:bg-slate-900') + '"><span class="text-lg leading-none" aria-hidden="true">' + i.icon + '</span>' + i.label + '</button>';
      }).join('');
    }

    function renderHeader() {
      $('session-banner').textContent = state.session
        ? state.userEmail + ' • ' + (state.isAdmin ? 'Admin' : 'Foydalanuvchi')
        : 'Mehmon rejimi • natijalar saqlanmaydi';
      $('auth-btn').textContent = state.session ? '👤 ' + state.userEmail.split('@')[0] : '🔐 Kirish';
      const pill = $('network-pill');
      const base = 'px-2.5 py-1.5 rounded-xl border text-[11px] font-extrabold ';
      if (!navigator.onLine) { pill.textContent = '📴 Offline'; pill.className = base + 'bg-amber-950/90 text-amber-200 border-amber-400/40'; }
      else if (state.sb) { pill.textContent = '☁️ Ulangan'; pill.className = base + 'bg-emerald-950/90 text-lime-200 border-lime-300/40'; }
      else { pill.textContent = '🔌 Ulanmagan'; pill.className = base + 'bg-slate-950/85 text-sky-200 border-sky-300/30'; }
      updateExamPill();
    }

    function renderMain(animate) {
      const main = $('view');
      let html;
      if (state.view === 'admin') html = viewAdmin();
      else if (state.view === 'results') html = viewResults();
      else if (state.view === 'leaderboard') html = viewLeaderboard();
      else html = viewQuiz();
      main.innerHTML = html;
      if (animate && window.gsap && main.children.length) {
        gsap.fromTo(main.children, { y: 6, opacity: 0 }, { y: 0, opacity: 1, duration: 0.2, stagger: 0.03, clearProps: 'all' });
      }
    }

    function renderApp(animate) {
      if (state.view === 'admin' && !state.isAdmin) state.view = 'quiz';
      clampIdx();
      renderNav();
      renderMain(animate === true);
      renderDock();
      renderHeader();
      if (state.editor) renderEditor();
    }

    const tile = (v, label, cls) =>
      '<div class="rounded-2xl bg-slate-950/70 border border-slate-800 p-3 text-center"><div class="text-2xl font-black tabular-nums ' + (cls || 'text-lime-300') + '">' + esc(v) + '</div><div class="text-[11px] text-slate-400 font-bold">' + esc(label) + '</div></div>';
    const emptyCard = (icon, text, extra) =>
      '<section class="app-card p-8 text-center space-y-3"><div class="text-4xl" aria-hidden="true">' + icon + '</div><p class="text-sm font-bold text-slate-200">' + esc(text) + '</p>' + (extra || '') + '</section>';
    const selectOpts = (list, selected, placeholder) =>
      (placeholder != null ? '<option value="">' + esc(placeholder) + '</option>' : '') +
      list.map(x => '<option value="' + esc(x.id) + '"' + (x.id === selected ? ' selected' : '') + '>' + esc(x.name) + '</option>').join('');

    /* ---------------- Render: Test (mashq + imtihon) ---------------- */
    function viewQuiz() {
      const ex = state.exam.active;
      const list = currentList();
      const q = currentQuestion();
      const topics = state.topics.filter(t => !state.subjectId || t.subject_id === state.subjectId);
      const st = practiceStats();

      let top;
      if (ex) {
        const answered = state.exam.ids.filter(id => state.exam.picks[id]).length;
        const pct = Math.round(answered * 100 / state.exam.ids.length);
        top = '<section class="app-card p-4 sm:p-5 space-y-3">' +
          '<div class="flex flex-wrap items-center justify-between gap-2">' +
          '<h1 class="text-lg font-black lemon-title">⏱️ Imtihon rejimi</h1>' +
          '<div class="flex items-center gap-2"><span class="text-xl font-black text-amber-200 tabular-nums" data-clock>' + fmtClock(state.exam.left) + '</span>' +
          '<button type="button" data-act="exam-finish" class="lemon-btn px-4 py-2 rounded-xl text-xs font-black"' + (state.exam.submitting ? ' disabled' : '') + '>' +
          (state.exam.submitting ? '<span class="spinner"></span> Yuborilmoqda...' : '🏁 Yakunlash') + '</button></div></div>' +
          '<div class="text-[11px] font-bold text-slate-300">Javob berildi: ' + answered + ' / ' + state.exam.ids.length + '</div>' +
          '<div class="h-2 rounded-full bg-slate-900 overflow-hidden border border-slate-800"><div class="h-full lemon-btn" style="width:' + pct + '%"></div></div>' +
          '<p class="text-[11px] text-slate-400">Imtihon davomida javoblar darhol tekshirilmaydi. Natija "Yakunlash" dan keyin ko\'rsatiladi.</p>' +
          '</section>';
      } else {
        top = '<section class="app-card p-4 sm:p-5 space-y-3">' +
          '<div class="flex flex-wrap items-center justify-between gap-2">' +
          '<div class="flex flex-wrap items-center gap-2"><h1 class="text-lg font-black lemon-title">📝 Test ishlash</h1>' +
          '<button type="button" data-act="shuffle" class="tactile-btn px-2.5 py-1 rounded-xl bg-slate-900 text-sky-200 border border-slate-700 text-[11px] font-black">🔀 ' + (state.shuffle ? 'Tartibga qaytarish' : 'Aralashtirish') + '</button>' +
          '<button type="button" data-act="exam-start" class="tactile-btn px-2.5 py-1 rounded-xl bg-amber-950/80 text-amber-200 border border-amber-400/40 text-[11px] font-black">⏱️ Imtihon</button></div>' +
          '<div class="flex gap-1.5 text-[11px] font-black">' +
          '<span class="lemon-pill px-2.5 py-1 rounded-full">✅ ' + st.correct + '</span>' +
          '<span class="px-2.5 py-1 rounded-full bg-rose-950/70 text-rose-200 border border-rose-400/35">❌ ' + st.wrong + '</span>' +
          '<span class="px-2.5 py-1 rounded-full bg-slate-900 text-slate-300 border border-slate-700">⏳ ' + st.left + '</span></div></div>' +
          '<div class="grid sm:grid-cols-2 gap-2.5">' +
          '<select data-change="subject" aria-label="Fan" class="field">' + selectOpts(state.subjects, state.subjectId, 'Barcha fanlar') + '</select>' +
          '<select data-change="topic" aria-label="Mavzu" class="field">' + selectOpts(topics, state.topicId, 'Barcha mavzular') + '</select></div>' +
          '<div class="h-2 rounded-full bg-slate-900 overflow-hidden border border-slate-800"><div class="h-full lemon-btn transition-all duration-300" style="width:' + (st.total ? Math.round((st.correct + st.wrong) * 100 / st.total) : 0) + '%"></div></div>' +
          (!state.session ? '<p class="text-[11px] text-amber-300 font-bold">Mehmon rejimi: natijalar saqlanmaydi. <button type="button" data-act="auth" class="underline">Kirish</button></p>' : '') +
          '</section>';
      }

      if (state.loading && !state.questions.length) return top + emptyCard('⏳', 'Savollar yuklanmoqda...');
      if (!q) return top + emptyCard('📭', state.statusMessage || 'Bu filtr bo\'yicha savol topilmadi.');

      const done = ex ? null : state.answers[q.id];
      const pick = ex ? state.exam.picks[q.id] : state.picks[q.id];
      const opts = optionsFor(q);
      const img = safeUrl(q.image_url);
      const subj = subjectName(q.subject_id);
      const tp = topicName(q.topic_id);

      let html = top + '<section class="app-card p-4 sm:p-6 space-y-4">' +
        '<div class="flex flex-wrap items-center justify-between gap-2 text-[11px] font-black text-slate-400">' +
        '<span>Savol ' + (state.idx + 1) + ' / ' + list.length + ' • <span class="text-sky-300">' + esc(subj) + '</span>' + (tp ? ' · ' + esc(tp) : '') + '</span>' +
        (done ? '<span class="' + (done.correct ? 'text-lime-300' : 'text-rose-300') + '">' + (done.correct ? '✅ To\'g\'ri' : '❌ Noto\'g\'ri • urinish: ' + done.attempts) + '</span>' : '') +
        '</div>' +
        '<h2 class="text-base sm:text-lg font-extrabold leading-relaxed break-words">' + esc(q.prompt) + '</h2>' +
        (img ? '<img src="' + esc(img) + '" alt="Savol rasmi" loading="lazy" referrerpolicy="no-referrer" class="max-h-64 max-w-full rounded-2xl border border-slate-700 object-contain" onerror="this.style.display=\'none\'" />' : '') +
        '<div class="grid gap-2.5" role="radiogroup">' +
        opts.map((o, i) => {
          let cls = 'bg-slate-950/70 border-slate-700 text-slate-100';
          let mark = String.fromCharCode(65 + i);
          if (done && done.picked === o.id) {
            cls = done.correct ? 'bg-emerald-950/80 border-lime-300/80 text-lime-100' : 'bg-rose-950/80 border-rose-400/70 text-rose-100';
            mark = done.correct ? '✓' : '✕';
          } else if (pick === o.id) {
            cls = 'bg-lime-300/15 border-lime-300/70 text-lime-100';
          }
          return '<button type="button" role="radio" aria-checked="' + (pick === o.id ? 'true' : 'false') + '" data-act="pick" data-id="' + esc(o.id) + '"' +
            (done && done.correct ? ' disabled' : '') +
            ' class="opt-btn flex items-center gap-3 text-left px-4 py-3 rounded-2xl border text-sm font-semibold ' + cls + '">' +
            '<span class="w-7 h-7 shrink-0 rounded-lg bg-slate-900 border border-slate-600 flex items-center justify-center text-xs font-black">' + mark + '</span>' +
            '<span class="flex-1 min-w-0 break-words">' + esc(o.label) + '</span></button>';
        }).join('') + '</div>' +
        (done && done.correct && done.explanation
          ? '<div class="p-3.5 rounded-2xl bg-emerald-950/50 border border-lime-300/30 text-xs text-lime-100 leading-relaxed"><strong class="text-lime-300">💡 Izoh:</strong> ' + esc(done.explanation) + '</div>'
          : '') +
        '<div class="flex flex-wrap items-center gap-2 pt-1">' +
        '<button type="button" data-act="prev" class="tactile-btn px-4 py-2.5 rounded-xl bg-slate-900 text-slate-200 border border-slate-700 text-xs font-black"' + (state.idx === 0 ? ' disabled' : '') + '>← Oldingi</button>' +
        (ex ? '' :
          '<button type="button" data-act="verify" class="lemon-btn flex-1 min-w-[140px] py-2.5 rounded-xl text-xs font-black"' +
          ((!pick || state.verifying || (done && done.correct)) ? ' disabled' : '') + '>' +
          (state.verifying ? '<span class="spinner"></span> Tekshirilmoqda...' : '🔎 Javobni tekshirish') + '</button>') +
        '<button type="button" data-act="next" class="tactile-btn px-4 py-2.5 rounded-xl bg-slate-900 text-slate-200 border border-slate-700 text-xs font-black"' + (state.idx >= list.length - 1 ? ' disabled' : '') + '>Keyingi →</button></div>' +
        '<p class="text-[11px] text-slate-500">Klaviatura: 1–6 variant, Enter tekshirish, ← → savollar.</p>' +
        '</section>';

      html += '<section class="app-card p-4"><div class="flex flex-wrap gap-1.5">' +
        list.map((x, i) => {
          let c;
          if (i === state.idx) c = 'lemon-btn';
          else if (ex) c = state.exam.picks[x.id] ? 'bg-sky-950/80 text-sky-200 border-sky-400/50' : 'bg-slate-950/80 text-slate-300 border-slate-700';
          else {
            const a = state.answers[x.id];
            c = a ? (a.correct ? 'bg-emerald-950/80 text-lime-200 border-lime-300/50' : 'bg-rose-950/80 text-rose-200 border-rose-400/50') : 'bg-slate-950/80 text-slate-300 border-slate-700';
          }
          return '<button type="button" data-act="goto" data-i="' + i + '" class="tactile-btn w-9 h-9 rounded-xl border text-xs font-black ' + c + '" aria-label="Savol ' + (i + 1) + '">' + (i + 1) + '</button>';
        }).join('') + '</div></section>';

      return html;
    }

    /* ---------------- Render: Natija ---------------- */
    function viewResults() {
      let html = '';
      const le = state.lastExam;
      if (le) {
        const pass = le.percent >= PASS_PERCENT;
        const map = new Map(state.questions.map(q => [q.id, q]));
        html += '<section class="app-card p-6 text-center space-y-4">' +
          '<h1 class="text-lg font-black lemon-title">🎯 So\'nggi imtihon natijasi</h1>' +
          '<div class="flex justify-center"><div class="ring" style="background:conic-gradient(' + (pass ? '#a3e635' : '#fb7185') + ' ' + le.percent + '%, #1e293b 0)"><div class="ring-inner"><div class="text-3xl font-black tabular-nums ' + (pass ? 'text-lime-300' : 'text-rose-300') + '">' + le.percent + '%</div></div></div></div>' +
          '<div class="text-sm font-black ' + (pass ? 'text-lime-300' : 'text-rose-300') + '">' + (pass ? '🎉 Muvaffaqiyatli topshirdingiz!' : '💪 Yana urinib ko\'ring') + ' (o\'tish: ' + PASS_PERCENT + '%)</div>' +
          '<div class="grid grid-cols-3 gap-2.5">' + tile(le.correct, 'To\'g\'ri') + tile(le.total - le.correct, 'Xato', 'text-rose-300') + tile(fmtClock(le.seconds), 'Sarflangan vaqt', 'text-sky-300') + '</div>' +
          '<button type="button" data-act="exam-start" class="lemon-btn px-5 py-2.5 rounded-xl text-xs font-black">🔄 Yangi imtihon</button></section>';
        html += '<section class="app-card p-4 sm:p-5 space-y-3"><h2 class="text-base font-black lemon-title">Imtihon savollari</h2><ul class="space-y-2">' +
          le.details.map((d, i) => {
            const q = map.get(d.id);
            if (!q) return '';
            const status = !d.answered ? '<span class="text-amber-300 font-black">Javob berilmagan</span>'
              : d.ok ? '<span class="text-lime-300 font-black">✅ To\'g\'ri</span>' : '<span class="text-rose-300 font-black">❌ Noto\'g\'ri</span>';
            return '<li class="rounded-2xl bg-slate-950/60 border border-slate-800 p-3.5 space-y-1.5"><div class="text-sm font-extrabold break-words">' + (i + 1) + '. ' + esc(q.prompt) + '</div>' +
              '<div class="text-[11px]">' + status + '</div>' +
              (d.ok && d.explanation ? '<div class="text-xs text-slate-300"><span class="font-black text-lime-300">💡 Izoh:</span> ' + esc(d.explanation) + '</div>' : '') + '</li>';
          }).join('') + '</ul></section>';
      }

      const st = practiceStats();
      html += '<section class="app-card p-5 space-y-4"><div class="flex items-center justify-between"><h1 class="text-lg font-black lemon-title">📊 Joriy mashq</h1>' +
        '<span class="lemon-pill px-3 py-1 rounded-full text-xs font-black">' + (st.total ? Math.round(st.correct * 100 / st.total) : 0) + '%</span></div>' +
        '<div class="grid grid-cols-3 gap-2.5">' + tile(st.correct, 'To\'g\'ri') + tile(st.wrong, 'Xato', 'text-rose-300') + tile(st.left, 'Qolgan', 'text-sky-300') + '</div>' +
        '<button type="button" data-act="reset-practice" class="tactile-btn px-4 py-2 rounded-xl bg-slate-900 text-lime-300 border border-lime-300/35 text-xs font-black">🔄 Mashqni nollash</button></section>';

      html += '<section class="app-card p-5 space-y-3"><h2 class="text-base font-black lemon-title">🗂️ Serverdagi tarix</h2>';
      if (!state.session) {
        html += '<p class="text-xs text-slate-300">Tarixni ko\'rish uchun tizimga kiring.</p><button type="button" data-act="auth" class="lemon-btn px-4 py-2 rounded-xl text-xs font-black">🔐 Kirish</button>';
      } else if (state.history === null) {
        html += '<p class="text-xs text-slate-300"><span class="spinner spinner-lime"></span> Yuklanmoqda...</p>';
      } else if (!state.history.length) {
        html += '<p class="text-xs text-slate-300">Hozircha urinishlar yo\'q.</p>';
      } else {
        const total = state.history.length;
        const ok = state.history.filter(h => h.is_correct).length;
        const uniq = new Set(state.history.map(h => h.question_id)).size;
        html += '<div class="grid grid-cols-3 gap-2.5">' + tile(total, 'Jami urinish', 'text-sky-300') + tile(Math.round(ok * 100 / total) + '%', 'Aniqlik') + tile(uniq, 'Ishlangan savol', 'text-amber-300') + '</div>';
      }
      return html + '</section>';
    }

    /* ---------------- Render: Reyting (joriy holatda placeholder) ---------------- */
    function viewLeaderboard() {
      const rows = state.leaderboard;
      let html = '<section class="app-card p-5 space-y-3"><div class="flex items-center justify-between gap-2"><h1 class="text-lg font-black lemon-title">🏆 Reyting</h1>' +
        '<button type="button" data-act="lb-refresh" class="tactile-btn px-3 py-1.5 rounded-xl bg-slate-900 text-lime-300 border border-lime-300/35 text-xs font-black">🔄 Yangilash</button></div>' +
        '<p class="text-[11px] text-slate-400">Kamida 5 savollik imtihonlardagi eng yaxshi natija bo\'yicha.</p>';
      if (!state.sb) return html + '<p class="text-xs text-slate-300">Server bilan aloqa yo\'q.</p></section>';
      if (rows === null) return html + '<p class="text-sm text-slate-300"><span class="spinner spinner-lime"></span> Yuklanmoqda...</p></section>';
      if (!rows.length) return html + '<p class="text-sm text-slate-300">Hozircha natijalar yo\'q. Birinchi bo\'ling!</p></section>';
      return html + '<ol class="divide-y divide-slate-800">' + rows.map(r => {
        const medal = r.pos === 1 ? '🥇' : r.pos === 2 ? '🥈' : r.pos === 3 ? '🥉' : String(r.pos);
        return '<li class="flex items-center gap-3 py-2.5 ' + (r.is_me ? 'bg-lime-300/10 -mx-2 px-2 rounded-xl' : '') + '">' +
          '<span class="w-8 text-center text-sm font-black text-slate-300">' + medal + '</span>' +
          '<span class="flex-1 min-w-0 truncate text-sm font-bold">' + esc(r.display_name) + (r.is_me ? ' <span class="text-lime-300 text-[11px]">(siz)</span>' : '') + '</span>' +
          '<span class="text-[11px] text-slate-400 font-bold hidden sm:inline">' + r.exams_count + ' imtihon · o\'rtacha ' + r.avg_percent + '%</span>' +
          '<span class="text-sm font-black text-lime-300 tabular-nums">' + Math.round(Number(r.best_percent)) + '%</span></li>';
      }).join('') + '</ol></section>';
    }

    function viewAdminDashboard() {
      const s = state.adminStats;
      if (!s) { loadAdminStats(); return '<section class="app-card p-6 text-sm text-slate-300"><span class="spinner spinner-lime"></span> Statistika yuklanmoqda...</section>'; }
      if (s.error) return '<section class="app-card p-6 space-y-3"><p class="text-sm text-rose-300">' + esc(s.error) + '</p><button type="button" data-act="stats-refresh" class="lemon-btn px-4 py-2 rounded-xl text-xs font-black">Qayta urinish</button></section>';
      const days = s.daily || [];
      const max = Math.max(1, ...days.map(d => d.count));
      return '<section class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">' +
        tile(s.users, 'Foydalanuvchilar', 'text-sky-300') + tile(s.active_questions + ' / ' + s.questions, 'Faol / jami savol') +
        tile(s.subjects + ' / ' + s.topics, 'Fan / mavzu', 'text-amber-300') + tile(s.exams_total, 'Imtihonlar', 'text-emerald-300') +
        tile(s.attempts_total, 'Jami urinish', 'text-sky-300') + tile(s.attempts_7d, 'So\'nggi 7 kun') +
        tile(s.avg_percent + '%', 'O\'rtacha imtihon', 'text-amber-300') + '<button type="button" data-act="stats-refresh" class="tactile-btn rounded-2xl bg-slate-900 text-lime-300 border border-lime-300/35 text-xs font-black">🔄 Yangilash</button></section>' +
        '<section class="app-card p-5 space-y-3"><h2 class="text-base font-black lemon-title">Kunlik urinishlar (7 kun)</h2>' +
        '<div class="flex items-end gap-2 h-40" role="img" aria-label="Kunlik urinishlar grafigi">' +
        days.map(d => '<div class="flex-1 flex flex-col items-center justify-end h-full gap-1"><span class="text-[10px] font-black text-slate-300">' + d.count + '</span>' +
          '<div class="w-full rounded-t-lg lemon-btn" style="height:' + Math.max(4, Math.round(d.count * 100 / max)) + '%"></div>' +
          '<span class="text-[10px] text-slate-500 font-bold">' + esc(String(d.day).slice(5)) + '</span></div>').join('') + '</div></section>';
    }

    /* ---------------- Render: Admin ---------------- */
    function viewAdmin() {
      if (!state.isAdmin) return '';
      const tabsDef = [['dashboard', '📊 Statistika'], ['subjects', '📚 Fanlar'], ['topics', '🧩 Mavzular'], ['questions', '❓ Savollar']];
      let html = '<section class="app-card p-4 flex flex-wrap items-center gap-2"><h1 class="text-lg font-black lemon-title mr-2">🛠️ Admin</h1>' +
        tabsDef.map(t => '<button type="button" data-act="admin-tab" data-tab="' + t[0] + '" class="tactile-btn px-3.5 py-1.5 rounded-xl text-xs font-black border ' +
          (state.adminTab === t[0] ? 'lemon-btn' : 'bg-slate-950/80 text-slate-200 border-slate-600/60') + '">' + t[1] + '</button>').join('') + '</section>';

      if (state.adminTab === 'dashboard') html += viewAdminDashboard();
      if (state.adminTab === 'subjects') {
        html += '<section class="app-card p-5 space-y-4"><form data-form="subject-add" class="flex gap-2"><input name="name" required maxlength="120" placeholder="Yangi fan nomi" class="field" />' +
          '<button class="lemon-btn px-4 rounded-xl text-xs font-black shrink-0">➕ Qo\'shish</button></form>' +
          '<ul class="divide-y divide-slate-800">' +
          (state.subjects.map(s => '<li class="flex items-center justify-between gap-2 py-2.5 text-sm"><span class="font-bold break-words min-w-0">' + esc(s.name) + ' <span class="text-[11px] text-slate-400 font-normal">· ' + state.questions.filter(q => q.subject_id === s.id).length + ' savol</span></span>' +
            '<button type="button" data-act="subject-del" data-id="' + esc(s.id) + '" class="tactile-btn px-3 py-1.5 rounded-xl bg-rose-950/80 text-rose-200 border border-rose-500/35 text-[11px] font-black shrink-0">🗑️</button></li>').join('') ||
            '<li class="py-3 text-xs text-slate-400">Fanlar yo\'q.</li>') + '</ul></section>';
      }
      if (state.adminTab === 'topics') {
        html += '<section class="app-card p-5 space-y-4"><form data-form="topic-add" class="grid sm:grid-cols-[1fr_1fr_auto] gap-2">' +
          '<select name="subject_id" required class="field">' + selectOpts(state.subjects, '', 'Fanni tanlang') + '</select>' +
          '<input name="name" required maxlength="120" placeholder="Yangi mavzu nomi" class="field" />' +
          '<button class="lemon-btn px-4 py-2.5 rounded-xl text-xs font-black">➕ Qo\'shish</button></form>' +
          '<ul class="divide-y divide-slate-800">' +
          (state.topics.map(t => '<li class="flex items-center justify-between gap-2 py-2.5 text-sm"><span class="min-w-0 break-words"><span class="font-bold">' + esc(t.name) + '</span> <span class="text-[11px] text-slate-400">· ' + esc(subjectName(t.subject_id)) + '</span></span>' +
            '<button type="button" data-act="topic-del" data-id="' + esc(t.id) + '" class="tactile-btn px-3 py-1.5 rounded-xl bg-rose-950/80 text-rose-200 border border-rose-500/35 text-[11px] font-black shrink-0">🗑️</button></li>').join('') ||
            '<li class="py-3 text-xs text-slate-400">Mavzular yo\'q.</li>') + '</ul></section>';
      }
      if (state.adminTab === 'questions') {
        html += '<section class="app-card p-5 flex flex-wrap items-center justify-between gap-3">' +
          '<div><h2 class="text-base font-black lemon-title">Savollar (' + state.questions.length + ')</h2><p class="text-[11px] text-slate-400">Yangi savol yoki tahrirlash uchun tugmani bosing.</p></div>' +
          '<button type="button" data-act="q-new" class="lemon-btn px-4 py-2.5 rounded-xl text-xs font-black">➕ Yangi savol</button></section>' +
          '<section class="app-card p-5 space-y-3">' +
          '<input data-search="admin-q" type="search" value="' + esc(state.adminSearch) + '" placeholder="🔍 Savol bo\'yicha qidirish..." class="field" />' +
          '<div id="admin-q-list">' + adminQuestionListHtml() + '</div></section>';
      }
      return html;
    }

    function adminQuestionListHtml() {
      const s = state.adminSearch.trim().toLowerCase();
      const all = state.questions.filter(q => !s || q.prompt.toLowerCase().indexOf(s) !== -1);
      const shown = all.slice(0, ADMIN_LIST_LIMIT);
      if (!shown.length) return '<p class="py-6 text-center text-xs text-slate-400">Savollar topilmadi.</p>';
      return '<ul class="divide-y divide-slate-800">' + shown.map(q =>
        '<li class="py-3 flex items-start justify-between gap-3"><div class="min-w-0"><div class="text-sm font-bold break-words">' + esc(q.prompt.length > 140 ? q.prompt.slice(0, 140) + '…' : q.prompt) + '</div>' +
        '<div class="text-[11px] text-slate-400">' + esc(subjectName(q.subject_id)) + (q.topic_id ? ' · ' + esc(topicName(q.topic_id)) : '') + ' · ' + q.options.length + ' variant</div></div>' +
        '<div class="flex gap-1.5 shrink-0"><button type="button" data-act="q-edit" data-id="' + esc(q.id) + '" class="tactile-btn px-3 py-1.5 rounded-xl bg-slate-900 text-lime-300 border border-lime-300/35 text-[11px] font-black">✏️</button>' +
        '<button type="button" data-act="q-del" data-id="' + esc(q.id) + '" class="tactile-btn px-3 py-1.5 rounded-xl bg-rose-950/80 text-rose-200 border border-rose-500/35 text-[11px] font-black">🗑️</button></div></li>').join('') +
        '</ul>' + (all.length > shown.length ? '<p class="text-[11px] text-slate-400 pt-2">Ko\'rsatilmoqda: ' + shown.length + ' / ' + all.length + '. Qidiruvdan foydalaning.</p>' : '');
    }

    /* ---------------- Savol muharriri (modal) ---------------- */
    function renderEditor() {
      const sheet = $('editor-sheet');
      const ed = state.editor;
      if (!ed) { sheet.classList.add('hidden'); sheet.classList.remove('flex'); sheet.innerHTML = ''; return; }
      const d = ed.draft;
      const topics = state.topics.filter(t => t.subject_id === d.subject_id);
      const img = safeUrl(d.image_url);
      sheet.innerHTML = '<div class="bottom-sheet-panel w-full sm:max-w-2xl rounded-t-3xl sm:rounded-3xl p-5 sm:p-6 max-h-[92vh] overflow-y-auto space-y-4">' +
        '<div class="flex items-center justify-between border-b border-slate-800 pb-3"><h2 class="text-lg font-black lemon-title">' + (d.id ? '✏️ Savolni tahrirlash' : '➕ Yangi savol') + '</h2>' +
        '<button type="button" data-act="ed-close" class="tactile-btn px-3 py-1.5 rounded-xl bg-slate-900 text-lime-300 border border-slate-700 text-xs font-black" aria-label="Yopish">✕</button></div>' +
        '<div class="grid sm:grid-cols-2 gap-2.5">' +
        '<select data-ed="subject_id" aria-label="Fan" class="field">' + selectOpts(state.subjects, d.subject_id, 'Fanni tanlang') + '</select>' +
        '<select data-ed="topic_id" aria-label="Mavzu" class="field">' + selectOpts(topics, d.topic_id, 'Mavzusiz') + '</select></div>' +
        '<textarea data-ed="prompt" rows="3" maxlength="2000" placeholder="Savol matni" class="field">' + esc(d.prompt) + '</textarea>' +
        '<input data-ed="image_url" type="url" value="' + esc(d.image_url) + '" placeholder="Rasm URL (ixtiyoriy, https://...)" class="field" />' +
        (img ? '<img src="' + esc(img) + '" alt="Oldindan ko\'rish" referrerpolicy="no-referrer" class="max-h-32 max-w-full rounded-xl border border-slate-700" onerror="this.style.display=\'none\'" />' : '') +
        '<div class="text-[11px] font-black text-lime-300">Variantlar (to\'g\'ri javobni radio tugma bilan belgilang):</div>' +
        d.options.map((o, i) => '<div class="flex items-center gap-2"><input type="radio" name="ed-correct" data-ed-correct="' + esc(o.id) + '"' + (d.correct_answer_id === o.id ? ' checked' : '') + ' class="w-4 h-4 shrink-0" aria-label="To\'g\'ri javob ' + (i + 1) + '" />' +
          '<input data-ed-opt="' + i + '" maxlength="500" value="' + esc(o.label) + '" placeholder="Variant ' + String.fromCharCode(65 + i) + '" class="field" />' +
          '<button type="button" data-act="ed-rm-opt" data-i="' + i + '" class="tactile-btn px-2.5 py-2 rounded-xl bg-slate-900 text-rose-300 border border-slate-700 text-xs font-black shrink-0"' + (d.options.length <= MIN_OPTIONS ? ' disabled' : '') + ' aria-label="Variantni o\'chirish">✕</button></div>').join('') +
        '<button type="button" data-act="ed-add-opt" class="tactile-btn px-3.5 py-2 rounded-xl bg-slate-900 text-lime-300 border border-lime-300/35 text-xs font-black"' + (d.options.length >= MAX_OPTIONS ? ' disabled' : '') + '>➕ Variant qo\'shish</button>' +
        '<textarea data-ed="explanation" rows="2" maxlength="3000" placeholder="Izoh (to\'g\'ri javobdan keyin ko\'rinadi, ixtiyoriy)" class="field">' + esc(d.explanation) + '</textarea>' +
        '<div class="flex gap-2 pt-1"><button type="button" data-act="ed-save" class="lemon-btn flex-1 py-2.5 rounded-xl text-xs font-black"' + (ed.saving ? ' disabled' : '') + '>' +
        (ed.saving ? '<span class="spinner"></span> Saqlanmoqda...' : '💾 Serverga saqlash') + '</button>' +
        '<button type="button" data-act="ed-close" class="tactile-btn px-4 py-2.5 rounded-xl bg-slate-900 text-slate-200 border border-slate-700 text-xs font-black">Bekor qilish</button></div></div>';
      sheet.classList.remove('hidden'); sheet.classList.add('flex');
    }

    function closeEditor() { state.editor = null; renderEditor(); }

    async function openEditor(id) {
      if (!requireAdmin()) return;
      if (!id) {
        const sid = state.subjects[0] ? state.subjects[0].id : '';
        state.editor = { saving: false, draft: blankDraft(sid, '') };
        return renderEditor();
      }
      const q = questionById(id);
      if (!q) return;
      try {
        const { data, error } = await state.sb.rpc('admin_get_correct_answer', { p_question_id: id });
        if (error) throw error;
        const correct = (data && data.correct_answer_id) || (q.options[0] && q.options[0].id) || '';
        state.editor = {
          saving: false,
          draft: {
            id: q.id, subject_id: q.subject_id, topic_id: q.topic_id || '',
            prompt: q.prompt, image_url: q.image_url || '',
            explanation: (data && data.explanation) || '',
            options: q.options.map(o => ({ id: o.id, label: o.label })),
            correct_answer_id: correct
          }
        };
        renderEditor();
      } catch (e) {
        notify(errMsg(e), 'error');
      }
    }

    async function saveEditor() {
      if (!requireAdmin()) return;
      const ed = state.editor;
      if (!ed || ed.saving) return;
      const d = ed.draft;
      const labels = d.options.map(o => o.label.trim());
      if (!d.subject_id) return notify('Fanni tanlang.', 'warn');
      if (!d.prompt.trim()) return notify('Savol matnini kiriting.', 'warn');
      if (labels.some(l => !l)) return notify('Barcha variantlarni to\'ldiring.', 'warn');
      if (new Set(labels.map(l => l.toLowerCase())).size !== labels.length) return notify('Variantlar takrorlanmasligi kerak.', 'warn');
      if (!d.options.some(o => o.id === d.correct_answer_id)) return notify('To\'g\'ri javobni belgilang.', 'warn');
      if (d.image_url.trim() && !safeUrl(d.image_url)) return notify('Rasm URL noto\'g\'ri.', 'warn');
      ed.saving = true; renderEditor();
      try {
        const { error } = await state.sb.rpc('admin_save_question', {
          p_id: d.id,
          p_subject_id: d.subject_id,
          p_topic_id: d.topic_id || null,
          p_prompt: d.prompt.trim(),
          p_image_url: safeUrl(d.image_url) || null,
          p_options: d.options.map((o, i) => ({ id: o.id, label: labels[i] })),
          p_correct_id: d.correct_answer_id,
          p_explanation: d.explanation.trim() || null
        });
        if (error) throw error;
        state.editor = null;
        renderEditor();
        await afterMutation('Savol saqlandi.');
      } catch (e) {
        ed.saving = false; renderEditor();
        notify(errMsg(e), 'error');
      }
    }

    /* ---------------- Admin amallari ---------------- */
    function requireAdmin() {
      if (!state.sb || !state.isAdmin) { notify('403: admin huquqi yo\'q.', 'error'); return false; }
      return true;
    }
    async function afterMutation(msg) {
      await syncCatalog();
      if (msg) notify(msg, 'success');
      renderApp();
    }
    async function adminInsert(table, row, okMsg) {
      if (!requireAdmin()) return false;
      const { error } = await state.sb.from(table).insert(row);
      if (error) { notify(errMsg(error), 'error'); return false; }
      await afterMutation(okMsg);
      return true;
    }
    async function adminDelete(table, id, text) {
      if (!requireAdmin()) return;
      const ok = await askConfirm(text, 'O\'chirishni tasdiqlang');
      if (!ok) return;
      const { error } = await state.sb.from(table).delete().eq('id', id);
      if (error) return notify(errMsg(error), 'error');
      afterMutation('O\'chirildi.');
    }

    /* ---------------- Hodisalar ---------------- */
    document.addEventListener('click', e => {
      const el = e.target.closest('[data-act]');
      if (!el || el.disabled) return;
      const act = el.dataset.act;
      const id = el.dataset.id;
      switch (act) {
        case 'nav': navigate(el.dataset.view); break;
        case 'auth': openAuth(); break;
        case 'auth-close': closeAuth(); break;
        case 'signup': doSignup(); break;
        case 'reset': doReset(); break;
        case 'logout': doLogout(); break;
        case 'theme':
          state.soft = !state.soft;
          document.body.classList.toggle('soft-day-mode', state.soft);
          idbSet('ui_soft_day', state.soft);
          break;
        case 'shuffle': state.shuffle = !state.shuffle; rebuildOrder(); state.idx = 0; renderApp(); break;
        case 'pick': pickAnswer(id); break;
        case 'verify': verifyCurrent(); break;
        case 'prev': goTo(state.idx - 1); break;
        case 'next': goTo(state.idx + 1); break;
        case 'goto': goTo(parseInt(el.dataset.i, 10)); break;
        case 'exam-start': startExam(); break;
        case 'exam-finish': finishExam(false); break;
        case 'reset-practice': state.answers = {}; state.picks = {}; renderApp(); break;
        case 'lb-refresh': state.leaderboard = null; renderApp(); loadLeaderboard(); break;
        case 'stats-refresh': state.adminStats = null; renderApp(); break;
        case 'recheck': applySession(state.session).then(() => { renderApp(); notify(state.isAdmin ? 'Admin huquqi tasdiqlandi.' : 'Hali admin emassiz.', state.isAdmin ? 'success' : 'warn'); }); break;
        case 'copy-id': if (navigator.clipboard) navigator.clipboard.writeText(state.userId || '').then(() => notify('ID nusxalandi.', 'success'), () => notify('Nusxalab bo\'lmadi. Matnni qo\'lda belgilang.', 'warn')); break;
        case 'admin-tab': state.adminTab = el.dataset.tab; renderApp(); break;
        case 'subject-del': adminDelete('subjects', id, 'Fan va unga tegishli barcha savollar o\'chiriladi. Davom etasizmi?'); break;
        case 'topic-del': adminDelete('topics', id, 'Mavzu o\'chirilsinmi? Savollar saqlanib qoladi.'); break;
        case 'q-new': openEditor(null); break;
        case 'q-edit': openEditor(id); break;
        case 'q-del': adminDelete('questions', id, 'Savol o\'chirilsinmi? Bu amalni qaytarib bo\'lmaydi.'); break;
        case 'ed-close': closeEditor(); break;
        case 'ed-save': saveEditor(); break;
        case 'ed-add-opt':
          if (state.editor && state.editor.draft.options.length < MAX_OPTIONS) {
            state.editor.draft.options.push({ id: uuid(), label: '' }); renderEditor();
          }
          break;
        case 'ed-rm-opt': {
          const d = state.editor && state.editor.draft;
          if (d && d.options.length > MIN_OPTIONS) {
            const rm = d.options.splice(parseInt(el.dataset.i, 10), 1)[0];
            if (rm && rm.id === d.correct_answer_id) d.correct_answer_id = d.options[0].id;
            renderEditor();
          }
          break;
        }
      }
    });

    document.addEventListener('change', e => {
      const t = e.target;
      const d = t.dataset || {};
      if (d.change === 'subject') { state.subjectId = t.value; state.topicId = ''; state.idx = 0; renderApp(); return; }
      if (d.change === 'topic') { state.topicId = t.value; state.idx = 0; renderApp(); return; }
      if (state.editor) {
        const dr = state.editor.draft;
        if (d.ed === 'subject_id') { dr.subject_id = t.value; dr.topic_id = ''; renderEditor(); }
        else if (d.ed === 'topic_id') dr.topic_id = t.value;
        else if (d.edCorrect !== undefined) dr.correct_answer_id = d.edCorrect;
        else if (d.ed === undefined && t.dataset.edCorrect) dr.correct_answer_id = t.dataset.edCorrect;
      }
    });

    document.addEventListener('input', e => {
      const t = e.target;
      const d = t.dataset || {};
      if (d.search === 'admin-q') {
        state.adminSearch = t.value;
        const list = $('admin-q-list');
        if (list) list.innerHTML = adminQuestionListHtml();
        return;
      }
      if (!state.editor) return;
      const dr = state.editor.draft;
      if (d.ed === 'prompt') dr.prompt = t.value;
      else if (d.ed === 'image_url') dr.image_url = t.value;
      else if (d.ed === 'explanation') dr.explanation = t.value;
      else if (d.edOpt !== undefined) { const o = dr.options[parseInt(d.edOpt, 10)]; if (o) o.label = t.value; }
    });

    document.addEventListener('click', e => {
      if (e.target.dataset && e.target.dataset.edCorrect !== undefined) {
        if (state.editor) state.editor.draft.correct_answer_id = e.target.dataset.edCorrect;
      }
    });

    document.addEventListener('submit', async e => {
      const f = e.target.closest('[data-form]');
      if (!f) return;
      e.preventDefault();
      try {
        if (f.dataset.form === 'login') await doLogin(f);
        else if (f.dataset.form === 'subject-add') { if (await adminInsert('subjects', { name: f.elements.name.value.trim() }, 'Fan qo\'shildi.')) f.reset(); }
        else if (f.dataset.form === 'topic-add') { if (await adminInsert('topics', { subject_id: f.elements.subject_id.value, name: f.elements.name.value.trim() }, 'Mavzu qo\'shildi.')) f.reset(); }
      } catch (err) {
        notify(errMsg(err), 'error');
      }
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { if (state.editor) closeEditor(); else closeAuth(); return; }
      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) return;
      if (state.view !== 'quiz' || !$('auth-sheet').classList.contains('hidden') || state.editor) return;
      const q = currentQuestion();
      if (!q) return;
      if (/^[1-9]$/.test(e.key)) { const o = optionsFor(q)[parseInt(e.key, 10) - 1]; if (o) pickAnswer(o.id); }
      else if (e.key === 'Enter' && !state.exam.active) verifyCurrent();
      else if (e.key === 'ArrowRight') goTo(state.idx + 1);
      else if (e.key === 'ArrowLeft') goTo(state.idx - 1);
    });

    window.addEventListener('beforeunload', e => {
      if (state.exam.active) { e.preventDefault(); e.returnValue = ''; }
    });
    window.addEventListener('online', async () => { renderHeader(); if (await ensureClient()) { await syncCatalog(); renderApp(); } });
    window.addEventListener('offline', () => { renderHeader(); notify('Offline: saqlangan savollar ko\'rsatiladi.', 'warn'); });
    $('auth-sheet').addEventListener('click', e => { if (e.target.id === 'auth-sheet') closeAuth(); });
    $('editor-sheet').addEventListener('click', e => { if (e.target.id === 'editor-sheet') closeEditor(); });

    /* ---------------- Boshlash ---------------- */
    (async function boot() {
      renderApp(true);
      if (await idbGet('ui_soft_day')) { state.soft = true; document.body.classList.add('soft-day-mode'); }
      const ok = await initClient();
      await syncCatalog();
      state.loading = false;
      renderApp(true);
      if (!ok) notify('Server bilan ulanib bo\'lmadi.', 'warn');
    })();
  })();
  </script>
</body>
</html>
