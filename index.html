<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1221" />
  <meta name="description" content="BilimXona — Supabase Auth JWT, PostgreSQL RLS va server RPC asosida ishlovchi xavfsiz onlayn test va imtihon platformasi." />
  <title>BilimXona — Enterprise Ta'lim va Test Platformasi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    * {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    :root {
      --bg-obsidian: #030508;
      --bg-midnight: #060911;
      --center-blue-glow: rgba(37, 99, 235, 0.24);
      --surface-card: linear-gradient(155deg, rgba(12, 19, 36, 0.96) 0%, rgba(6, 10, 19, 0.98) 100%);
      --border-subtle: rgba(148, 163, 184, 0.16);
      --text-primary: #e8f1ff;
      --text-secondary: #9fb0cc;
      --lemon-soft: #d9f99d;
      --lemon-mid: #bef264;
      --lemon-bright: #a3e635;
      --lemon-deep: #84cc16;
    }
    body.soft-day-mode {
      --bg-obsidian: #151d30;
      --bg-midnight: #0f1625;
      --center-blue-glow: rgba(59, 130, 246, 0.24);
      --surface-card: linear-gradient(155deg, rgba(27, 38, 60, 0.96) 0%, rgba(19, 28, 46, 0.98) 100%);
      --border-subtle: rgba(190, 242, 100, 0.24);
      --text-primary: #edf4ff;
      --text-secondary: #b7c7e0;
    }
    body {
      background-color: var(--bg-obsidian);
      background-image:
        radial-gradient(circle at 50% 22%, var(--center-blue-glow) 0%, rgba(15, 23, 42, 0.14) 38%, rgba(3, 5, 8, 0.98) 76%),
        linear-gradient(180deg, var(--bg-obsidian) 0%, var(--bg-midnight) 100%);
      background-attachment: fixed;
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .main-menu-shell {
      background: linear-gradient(90deg,
        rgba(124, 45, 18, 0.92) 0%, rgba(14, 116, 144, 0.92) 22%,
        rgba(29, 78, 216, 0.98) 50%, rgba(67, 56, 202, 0.94) 78%, rgba(6, 95, 70, 0.92) 100%);
      border-bottom: 1px solid rgba(190, 242, 100, 0.28);
      box-shadow: 0 12px 34px rgba(2, 6, 23, 0.8), 0 0 46px rgba(37, 99, 235, 0.28);
      backdrop-filter: blur(12px);
    }
    .app-card {
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      box-shadow: 0 16px 36px rgba(2, 6, 23, 0.68), inset 0 1px 0 rgba(190, 242, 100, 0.08);
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.2s ease;
    }
    .app-card:hover { border-color: rgba(190, 242, 100, 0.36); }
    .lemon-title { color: var(--lemon-soft); text-shadow: 0 0 18px rgba(163, 230, 53, 0.16); }
    .lemon-btn {
      background: linear-gradient(135deg, #d9f99d 0%, #bef264 45%, #a3e635 85%, #84cc16 100%);
      color: #071105;
      border: 1px solid rgba(217, 249, 157, 0.72);
      box-shadow: 0 6px 20px rgba(132, 204, 22, 0.26);
      transition: transform 0.14s ease, filter 0.16s ease, opacity 0.16s ease;
    }
    .lemon-btn:hover:not(:disabled) { filter: brightness(1.06); }
    .lemon-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .lemon-btn:active:not(:disabled), .tactile-btn:active:not(:disabled) { transform: scale(0.96); }
    .tactile-btn { transition: transform 0.14s ease, background-color 0.16s ease, border-color 0.16s ease; }
    .tactile-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .lemon-pill {
      background: rgba(163, 230, 53, 0.14); color: #d9f99d;
      border: 1px solid rgba(190, 242, 100, 0.35);
    }
    .bottom-sheet-panel {
      background: linear-gradient(180deg, #0d1629 0%, #060911 100%);
      border: 1px solid rgba(190, 242, 100, 0.26);
      box-shadow: 0 -14px 45px rgba(0, 0, 0, 0.85), 0 0 42px rgba(29, 78, 216, 0.24);
    }
    .app-footer {
      background: linear-gradient(180deg, #04070d 0%, #020306 100%);
      border-top: 1px solid rgba(148, 163, 184, 0.14);
    }
    .field {
      width: 100%; padding: 0.65rem 0.875rem; border-radius: 0.75rem;
      background: #0b1220; border: 1px solid #334155; color: #e8f1ff;
      font-size: 0.78rem; outline: none; transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .field:focus { border-color: #a3e635; box-shadow: 0 0 0 3px rgba(163, 230, 53, 0.12); }
    .opt-btn { transition: transform 0.14s ease, border-color 0.15s ease, background-color 0.15s ease; }
    .opt-btn:hover:not(:disabled) { border-color: rgba(190, 242, 100, 0.55); transform: translateY(-1px); }
    .opt-btn:disabled { cursor: default; }
    .spinner {
      width: 14px; height: 14px; border-radius: 9999px; display: inline-block;
      border: 2px solid rgba(7, 17, 5, 0.25); border-top-color: #071105;
      animation: spin 0.7s linear infinite; vertical-align: -2px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    :focus-visible { outline: 2px solid #a3e635; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body class="pb-24 sm:pb-12">
  <div id="bilimxona-prod-app" class="min-h-screen flex flex-col justify-between">
    <div>
      <header class="main-menu-shell sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 py-3 space-y-2.5">
          <div class="flex flex-wrap items-center justify-between gap-2.5">
            <button type="button" onclick="BilimXonaProd.navigate('quiz')" class="tactile-btn flex items-center gap-2.5 text-left">
              <div class="w-11 h-11 rounded-2xl bg-slate-950/90 border border-lime-300/45 flex items-center justify-center text-2xl shadow-lg">🛡️</div>
              <div>
                <div class="flex items-center gap-2">
                  <span class="text-lg sm:text-xl font-black lemon-title tracking-tight">BilimXona</span>
                  <span class="px-2 py-0.5 rounded-full text-[10px] font-black bg-lime-300/20 text-lime-200 border border-lime-300/40">Enterprise</span>
                </div>
                <p id="jwt-session-banner" class="text-[11px] text-slate-200/90 font-semibold">JWT Sessiya tekshirilmoqda...</p>
              </div>
            </button>
            <div class="flex flex-wrap items-center gap-1.5 sm:gap-2">
              <span id="exam-timer-pill" class="hidden px-2.5 py-1.5 rounded-xl bg-amber-950/90 text-amber-200 border border-amber-400/45 text-[11px] font-black">⏱️ 00:00</span>
              <span id="network-mode-pill" class="px-2.5 py-1.5 rounded-xl bg-slate-950/80 text-sky-200 border border-sky-300/30 text-[11px] font-extrabold">🌐 Tarmoq</span>
              <button type="button" onclick="BilimXonaProd.openAuthSheet()" class="lemon-btn px-3 py-1.5 rounded-xl text-xs font-black">🔐 Kirish / Ulanish</button>
              <button type="button" onclick="BilimXonaProd.toggleSoftDayMode()" class="tactile-btn px-3 py-1.5 rounded-xl bg-slate-950/85 hover:bg-slate-900 text-lime-300 border border-lime-300/35 text-xs font-extrabold" title="Rejimni almashtirish">🌓</button>
            </div>
          </div>
          <nav id="prod-nav-tabs" aria-label="Asosiy bo'limlar" class="flex items-center gap-1.5 sm:gap-2 overflow-x-auto no-scrollbar pb-0.5"></nav>
        </div>
      </header>
      <main id="prod-main-view" class="max-w-7xl mx-auto px-3 sm:px-6 py-5 space-y-5"></main>
    </div>

    <nav aria-label="Tezkor mobil navigatsiya" class="fixed bottom-0 inset-x-0 z-40 bg-slate-950/95 backdrop-blur-md border-t border-lime-300/20 px-2 py-1.5 sm:hidden">
      <div id="prod-mobile-dock" class="grid grid-cols-4 gap-1 max-w-md mx-auto"></div>
    </nav>

    <footer class="app-footer mt-12 py-6 px-4 text-xs text-slate-400">
      <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
        <div><strong class="lemon-title">BilimXona</strong> — Supabase Auth JWT + PostgreSQL RLS + RPC <code class="text-lime-300">verify_answer</code></div>
        <div class="text-[11px] text-lime-300/85 font-semibold">Zero-Trust Client • Server-side Javob Tekshiruvi</div>
      </div>
    </footer>
  </div>

  <div id="prod-toast-stack" class="fixed top-20 right-3 sm:right-6 z-50 flex flex-col gap-2 max-w-sm pointer-events-none" aria-live="polite"></div>

  <div id="confirm-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/85 backdrop-blur-sm p-4" role="dialog" aria-modal="true">
    <div class="bottom-sheet-panel w-full max-w-md rounded-3xl p-5 space-y-4">
      <div class="text-base font-black lemon-title" id="confirm-title">Tasdiqlash</div>
      <p class="text-xs text-slate-300 leading-relaxed" id="confirm-text"></p>
      <div class="flex justify-end gap-2">
        <button type="button" id="confirm-no" class="tactile-btn px-4 py-2 rounded-xl bg-slate-900 text-slate-200 border border-slate-700 text-xs font-black">Bekor qilish</button>
        <button type="button" id="confirm-yes" class="tactile-btn px-4 py-2 rounded-xl bg-rose-600 text-slate-100 border border-rose-400/50 text-xs font-black">Ha, o'chirilsin</button>
      </div>
    </div>
  </div>

  <div id="jwt-auth-sheet" class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center bg-slate-950/85 backdrop-blur-sm p-0 sm:p-4" role="dialog" aria-modal="true" aria-label="Kirish va Supabase ulanishi">
    <div class="bottom-sheet-panel w-full sm:max-w-xl rounded-t-3xl sm:rounded-3xl p-5 sm:p-6 max-h-[90vh] overflow-y-auto space-y-5">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <div>
          <span class="lemon-pill px-2.5 py-0.5 rounded-full text-[11px] font-black">🔐 Supabase Auth JWT</span>
          <h2 class="text-xl font-black lemon-title mt-1">Akkaunt va Baza Sozlamalari</h2>
        </div>
        <button type="button" onclick="BilimXonaProd.closeAuthSheet()" class="tactile-btn px-3 py-1.5 rounded-xl bg-slate-900 text-lime-300 border border-slate-700 text-xs font-black">✕ Yopish</button>
      </div>

      <form onsubmit="BilimXonaProd.submitJwtLogin(event)" class="space-y-3 bg-slate-950/80 p-4 rounded-2xl border border-slate-800">
        <div class="text-xs font-black text-lime-300">1. Foydalanuvchi / Admin Kirishi</div>
        <input id="jwt-login-email" type="email" required autocomplete="email" placeholder="email@domen.uz" class="field" />
        <input id="jwt-login-password" type="password" required minlength="6" autocomplete="current-password" placeholder="Parol (kamida 6 belgi)" class="field" />
        <div class="flex flex-wrap gap-2">
          <button type="submit" class="lemon-btn flex-1 min-w-[130px] py-2.5 rounded-xl text-xs font-black">✅ Kirish</button>
          <button type="button" onclick="BilimXonaProd.signUpJwt()" class="tactile-btn px-4 py-2.5 rounded-xl bg-slate-900 text-lime-300 border border-lime-300/35 text-xs font-black">📝 Ro'yxatdan o'tish</button>
          <button type="button" onclick="BilimXonaProd.logoutJwt()" class="tactile-btn px-4 py-2.5 rounded-xl bg-rose-950/80 text-rose-200 border border-rose-500/35 text-xs font-black">Chiqish</button>
        </div>
      </form>

      <form onsubmit="BilimXonaProd.connectSupabaseProject(event)" class="space-y-3 bg-slate-950/80 p-4 rounded-2xl border border-slate-800">
        <div class="text-xs font-black text-lime-300">2. Supabase Loyiha Parametrlari (IndexedDB)</div>
        <input id="supa-project-url" type="url" required placeholder="https://xyzcompany.supabase.co" class="field" />
        <input id="supa-project-anon" type="text" required placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6... (Anon Public Key)" class="field" />
        <button type="submit" class="lemon-btn w-full py-2.5 rounded-xl text-xs font-black">☁️ Supabase Clientni Ishga Tushirish</button>
      </form>
    </div>
  </div>

  <script>
  (function () {
    'use strict';

    const IDB_NAME = 'bilimxona_enterprise_v2';
    const IDB_STORE = 'runtime_cache';
    const MAX_OPTIONS = 6;
    const MIN_OPTIONS = 2;

    const uuid = () => (crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
          const r = Math.random() * 16 | 0;
          return (c === 'x' ? r : (r & 3 | 8)).toString(16);
        });

    function shuffleArray(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function blankDraft(subjectId, topicId) {
      const opts = [0, 1, 2, 3].map(() => ({ id: uuid(), label: '' }));
      return {
        subject_id: subjectId || '',
        topic_id: topicId || '',
        prompt: '',
        image_url: '',
        explanation: '',
        options: opts,
        correct_answer_id: opts[0].id
      };
    }

    const state = {
      view: 'quiz',
      adminTab: 'subjects',
      adminSearch: '',
      softDayMode: false,
      supabaseClient: null,
      authSub: null,
      supabaseUrl: '',
      supabaseAnonKey: '',
      session: null,
      userId: null,
      userEmail: '',
      isServerAdmin: false,
      loading: false,
      subjects: [],
      topics: [],
      questions: [],
      displayOrder: [],
      shuffledOptionsMap: {},
      selectedSubjectId: '',
      selectedTopicId: '',
      activeQuestionIndex: 0,
      draftSelections: {},
      answers: {},
      verifyingAnswer: false,
      examMode: false,
      examSecondsLeft: 0,
      examInterval: null,
      history: null,
      editingQuestionId: null,
      editingDraft: blankDraft(),
      statusMessage: 'Supabase loyihasini ulang yoki JWT sessiyani faollashtiring.'
    };

    const $ = id => document.getElementById(id);

    let dbPromise = null;
    function openMetaDb() {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((resolve, reject) => {
        if (!('indexedDB' in window)) return reject(new Error('IndexedDB mavjud emas'));
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE, { keyPath: 'key' });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => { dbPromise = null; reject(req.error); };
      });
      return dbPromise;
    }
    async function idbGet(key) {
      try {
        const db = await openMetaDb();
        return await new Promise(resolve => {
          const r = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).get(key);
          r.onsuccess = () => resolve(r.result ? r.result.value : null);
          r.onerror = () => resolve(null);
        });
      } catch (_) { return null; }
    }
    async function idbSet(key, value) {
      try {
        const db = await openMetaDb();
        await new Promise((resolve, reject) => {
          const r = db.transaction(IDB_STORE, 'readwrite').objectStore(IDB_STORE).put({ key, value, updatedAt: Date.now() });
          r.onsuccess = () => resolve();
          r.onerror = () => reject(r.error);
        });
      } catch (_) {}
    }

    function esc(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function safeUrl(u) {
      try {
        const x = new URL(String(u || '').trim());
        return (x.protocol === 'https:' || x.protocol === 'http:') ? x.href : '';
      } catch (_) { return ''; }
    }
    function errMsg(e) {
      if (!e) return 'Noma\'lum xatolik';
      if (e.code === '42501' || /forbidden|permission denied|row-level security/i.test(e.message || '')) {
        return 'Ruxsat yo\'q (403): bu amal faqat adminlar uchun.';
      }
      return e.message || String(e);
    }
    function notify(text, level) {
      const stack = $('prod-toast-stack');
      if (!stack) return;
      const styles = {
        success: 'bg-emerald-950/95 text-lime-200 border-lime-300/45',
        error: 'bg-rose-950/95 text-rose-200 border-rose-400/50',
        warn: 'bg-amber-950/95 text-amber-200 border-amber-400/45',
        info: 'bg-blue-950/95 text-lime-200 border-lime-300/35'
      };
      const el = document.createElement('div');
      el.className = 'px-4 py-3 rounded-2xl border text-xs font-extrabold shadow-2xl ' + (styles[level] || styles.info);
      el.textContent = text;
      stack.appendChild(el);
      if (window.gsap) gsap.fromTo(el, { y: -10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.2 });
      setTimeout(() => el.remove(), 3500);
    }
    function askConfirm(text, title) {
      return new Promise(resolve => {
        const modal = $('confirm-modal');
        $('confirm-title').textContent = title || 'Tasdiqlash';
        $('confirm-text').textContent = text;
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        const cleanup = res => {
          modal.classList.add('hidden');
          modal.classList.remove('flex');
          $('confirm-yes').onclick = null;
          $('confirm-no').onclick = null;
          resolve(res);
        };
        $('confirm-yes').onclick = () => cleanup(true);
        $('confirm-no').onclick = () => cleanup(false);
      });
    }

    function updateNetworkBadge() {
      const el = $('network-mode-pill');
      if (!el) return;
      const base = 'px-2.5 py-1.5 rounded-xl border text-[11px] font-extrabold ';
      if (!navigator.onLine) {
        el.textContent = '📴 Offline';
        el.className = base + 'bg-amber-950/90 text-amber-200 border-amber-400/40';
      } else if (state.supabaseClient) {
        el.textContent = '☁️ Online';
        el.className = base + 'bg-emerald-950/90 text-lime-200 border-lime-300/40';
      } else {
        el.textContent = '🔌 Ulanmagan';
        el.className = base + 'bg-slate-950/85 text-sky-200 border-sky-300/30';
      }
    }
    function updateJwtBanner() {
      const b = $('jwt-session-banner');
      if (!b) return;
      b.textContent = (state.session && state.userEmail)
        ? state.userEmail + ' • ' + (state.isServerAdmin ? 'ADMIN (RLS tasdiqlangan)' : 'Talaba / Foydalanuvchi')
        : 'Mehmon rejimi • Natijalarni saqlash uchun tizimga kiring';
    }

    function formatSeconds(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return m + ':' + s;
    }
    function startExamMode() {
      const list = filteredQuestions();
      if (!list.length) return notify('Imtihon uchun savollar mavjud emas.', 'warn');
      stopExamMode(true);
      state.answers = {};
      state.draftSelections = {};
      state.activeQuestionIndex = 0;
      shuffleSession();
      state.examMode = true;
      state.examSecondsLeft = list.length * 60;
      const pill = $('exam-timer-pill');
      pill.classList.remove('hidden');
      pill.textContent = '⏱️ ' + formatSeconds(state.examSecondsLeft);

      state.examInterval = setInterval(() => {
        state.examSecondsLeft--;
        pill.textContent = '⏱️ ' + formatSeconds(Math.max(0, state.examSecondsLeft));
        if (state.examSecondsLeft <= 30) {
          pill.classList.add('animate-pulse', 'text-rose-200', 'border-rose-400');
        }
        if (state.examSecondsLeft <= 0) {
          stopExamMode(false);
          notify('⏰ Imtihon vaqti tugadi! Natijalaringiz tayyor.', 'warn');
          navigate('results');
        }
      }, 1000);
      notify('⏱️ Imtihon boshlandi (' + list.length + ' daqiqa)!', 'info');
      renderApp();
    }
    function stopExamMode(silent) {
      if (state.examInterval) clearInterval(state.examInterval);
      state.examInterval = null;
      state.examMode = false;
      const pill = $('exam-timer-pill');
      if (pill) {
        pill.classList.add('hidden');
        pill.classList.remove('animate-pulse', 'text-rose-200', 'border-rose-400');
      }
      if (!silent) renderApp();
    }

    async function initSupabaseClient(url, anonKey) {
      const cleanUrl = (url || '').trim();
      const cleanKey = (anonKey || '').trim();
      if (!cleanUrl || !cleanKey) return false;
      if (!window.supabase || !window.supabase.createClient) {
        notify('Supabase kutubxonasi yuklanmadi.', 'error');
        return false;
      }
      if (!safeUrl(cleanUrl)) { notify('Supabase URL noto\'g\'ri.', 'error'); return false; }

      try {
        if (state.authSub) { state.authSub.unsubscribe(); state.authSub = null; }
        state.supabaseUrl = cleanUrl;
        state.supabaseAnonKey = cleanKey;
        state.supabaseClient = window.supabase.createClient(cleanUrl, cleanKey, {
          auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
        });

        await idbSet('supabase_config', { url: cleanUrl, anonKey: cleanKey });
        const { data } = await state.supabaseClient.auth.getSession();
        await applyJwtSession(data && data.session ? data.session : null);

        const sub = state.supabaseClient.auth.onAuthStateChange((event, nextSession) => {
          setTimeout(async () => {
            if (event === 'INITIAL_SESSION') return;
            await applyJwtSession(nextSession);
            if (event === 'SIGNED_IN' || event === 'SIGNED_OUT' || event === 'USER_UPDATED') {
              await syncCatalogFromSupabase();
            }
            renderApp();
          }, 0);
        });
        state.authSub = sub.data.subscription;
        return true;
      } catch (e) {
        state.supabaseClient = null;
        notify('Ulanishda xatolik: ' + errMsg(e), 'error');
        return false;
      }
    }

    async function applyJwtSession(session) {
      state.session = session || null;
      state.userId = session && session.user ? session.user.id : null;
      state.userEmail = session && session.user ? (session.user.email || '') : '';
      state.history = null;
      await checkAdminViaRpc();
    }

    async function checkAdminViaRpc() {
      if (!state.supabaseClient || !state.session || !state.session.access_token) {
        state.isServerAdmin = false;
        return false;
      }
      try {
        const { data, error } = await state.supabaseClient.rpc('is_admin');
        state.isServerAdmin = !error && data === true;
      } catch (_) { state.isServerAdmin = false; }
      return state.isServerAdmin;
    }

    function normalizeQuestions(rows) {
      return (rows || []).map(q => ({
        id: q.id,
        subject_id: q.subject_id,
        topic_id: q.topic_id || '',
        prompt: q.prompt,
        image_url: q.image_url || '',
        options: (q.answers || [])
          .slice()
          .sort((a, b) => (a.position || 0) - (b.position || 0))
          .map(a => ({ id: a.id, label: a.label }))
      }));
    }

    function rebuildOrder(doShuffle) {
      const ids = state.questions.map(q => q.id);
      state.displayOrder = doShuffle ? shuffleArray(ids) : ids;
      state.shuffledOptionsMap = {};
      state.questions.forEach(q => {
        state.shuffledOptionsMap[q.id] = doShuffle ? shuffleArray(q.options) : q.options;
      });
    }

    function shuffleSession() {
      rebuildOrder(true);
      state.activeQuestionIndex = 0;
      notify('🔀 Savollar va variantlar aralashtirildi.', 'info');
      renderApp();
    }

    async function loadCatalogFromCache() {
      const cached = await idbGet('catalog');
      if (!cached) return false;
      state.subjects = cached.subjects || [];
      state.topics = cached.topics || [];
      state.questions = cached.questions || [];
      rebuildOrder(false);
      return state.questions.length > 0 || state.subjects.length > 0;
    }

    async function syncCatalogFromSupabase() {
      if (!state.supabaseClient) { await loadCatalogFromCache(); return false; }
      state.loading = true;
      try {
        const sb = state.supabaseClient;
        const [s, t, q] = await Promise.all([
          sb.from('subjects').select('id,name').order('name'),
          sb.from('topics').select('id,subject_id,name').order('name'),
          sb.from('questions').select('id,subject_id,topic_id,prompt,image_url,created_at,answers(id,label,position)').order('created_at')
        ]);
        const err = s.error || t.error || q.error;
        if (err) throw err;

        state.subjects = s.data || [];
        state.topics = t.data || [];
        state.questions = normalizeQuestions(q.data);
        rebuildOrder(false);
        await idbSet('catalog', { subjects: state.subjects, topics: state.topics, questions: state.questions });

        if (state.selectedSubjectId && !state.subjects.some(x => x.id === state.selectedSubjectId)) state.selectedSubjectId = '';
        if (state.selectedTopicId && !state.topics.some(x => x.id === state.selectedTopicId)) state.selectedTopicId = '';
        clampIndex();
        state.statusMessage = state.questions.length ? '' : 'Hozircha savollar yo\'q. Admin savollar qo\'shishi kerak.';
        return true;
      } catch (e) {
        const had = await loadCatalogFromCache();
        state.statusMessage = had ? 'Server bilan aloqa yo\'q — kesh nusxa ko\'rsatilmoqda.' : 'Ma\'lumot yuklanmadi: ' + errMsg(e);
        notify('Katalog yuklanmadi: ' + errMsg(e), 'warn');
        return false;
      } finally {
        state.loading = false;
      }
    }

    function filteredQuestions() {
      const qMap = new Map(state.questions.map(q => [q.id, q]));
      const ordered = state.displayOrder.length
        ? state.displayOrder.map(id => qMap.get(id)).filter(Boolean)
        : state.questions;

      return ordered.filter(q =>
        (!state.selectedSubjectId || q.subject_id === state.selectedSubjectId) &&
        (!state.selectedTopicId || q.topic_id === state.selectedTopicId));
    }
    function clampIndex() {
      const n = filteredQuestions().length;
      if (state.activeQuestionIndex >= n) state.activeQuestionIndex = Math.max(0, n - 1);
      if (state.activeQuestionIndex < 0) state.activeQuestionIndex = 0;
    }
    function currentQuestion() { return filteredQuestions()[state.activeQuestionIndex] || null; }

    function goToQuestion(i) {
      const n = filteredQuestions().length;
      if (!n) return;
      state.activeQuestionIndex = Math.min(n - 1, Math.max(0, i));
      renderApp();
    }

    function pickAnswer(id) {
      const q = currentQuestion();
      if (!q || state.verifyingAnswer) return;
      const done = state.answers[q.id];
      if (done && done.correct) return;
      state.draftSelections[q.id] = id;
      renderApp();
    }

    async function verifyCurrent() {
      const q = currentQuestion();
      if (!q || state.verifyingAnswer) return;
      const chosenId = state.draftSelections[q.id];
      if (!chosenId) return;
      if (!state.supabaseClient) { notify('Avval Supabase\'ga ulaning.', 'warn'); return openAuthSheet(); }
      if (!navigator.onLine) { notify('Javobni tekshirish uchun internet kerak.', 'warn'); return; }

      state.verifyingAnswer = true;
      renderApp();
      try {
        const { data, error } = await state.supabaseClient.rpc('verify_answer', {
          p_question_id: q.id,
          p_answer_id: chosenId
        });
        if (error) throw error;

        const ok = typeof data === 'boolean' ? data : Boolean(data && data.correct);
        const explanation = (data && typeof data === 'object') ? data.explanation : null;
        const prev = state.answers[q.id];

        state.answers[q.id] = {
          answerId: chosenId,
          correct: ok,
          explanation: explanation,
          attemptsCount: (prev ? prev.attemptsCount : 0) + 1
        };
        state.history = null;
        notify(ok ? '✅ To\'g\'ri javob!' : '❌ Noto\'g\'ri javob.', ok ? 'success' : 'error');
      } catch (e) {
        notify('Tekshirishda xatolik: ' + errMsg(e), 'error');
      } finally {
        state.verifyingAnswer = false;
        renderApp();
      }
    }

    function sessionStats() {
      const list = filteredQuestions();
      const total = list.length;
      let correct = 0, wrong = 0;
      list.forEach(q => {
        const a = state.answers[q.id];
        if (a) a.correct ? correct++ : wrong++;
      });
      return { total, correct, wrong, left: total - correct - wrong };
    }

    async function loadHistory() {
      if (!state.supabaseClient || !state.session) { state.history = []; return; }
      try {
        const { data, error } = await state.supabaseClient
          .from('attempts').select('question_id,is_correct,created_at')
          .order('created_at', { ascending: false }).limit(500);
        if (error) throw error;
        state.history = data || [];
      } catch (e) {
        state.history = [];
        notify('Tarixni yuklab bo\'lmadi: ' + errMsg(e), 'warn');
      }
      renderApp();
    }

    function tabsDef() {
      const t = [{ id: 'quiz', label: '📝 Test' }, { id: 'results', label: '📊 Natijalar' }];
      if (state.isServerAdmin) t.push({ id: 'admin', label: '🛠️ Admin' });
      return t;
    }

    function renderNav() {
      const nav = $('prod-nav-tabs');
      if (!nav) return;
      nav.innerHTML = tabsDef().map(t => {
        const active = state.view === t.id;
        return '<button type="button" data-act="nav" data-view="' + t.id + '" class="tactile-btn shrink-0 px-3.5 py-1.5 rounded-xl text-xs font-black border ' +
          (active ? 'lemon-btn' : 'bg-slate-950/80 text-slate-200 border-slate-600/60 hover:bg-slate-900') + '"' +
          (active ? ' aria-current="page"' : '') + '>' + t.label + '</button>';
      }).join('');
    }

    function renderDock() {
      const dock = $('prod-mobile-dock');
      if (!dock) return;
      const items = [
        { act: 'nav', view: 'quiz', icon: '📝', label: 'Test', on: state.view === 'quiz' },
        { act: 'nav', view: 'results', icon: '📊', label: 'Natija', on: state.view === 'results' },
        state.isServerAdmin
          ? { act: 'nav', view: 'admin', icon: '🛠️', label: 'Admin', on: state.view === 'admin' }
          : { act: 'auth', icon: '🔐', label: state.session ? 'Profil' : 'Kirish', on: false },
        { act: 'theme', icon: '🌓', label: 'Rejim', on: false }
      ];
      dock.innerHTML = items.map(i =>
        '<button type="button" data-act="' + i.act + '"' + (i.view ? ' data-view="' + i.view + '"' : '') +
        ' class="tactile-btn flex flex-col items-center gap-0.5 py-1.5 rounded-xl text-[10px] font-black ' +
        (i.on ? 'bg-lime-300/20 text-lime-200' : 'text-slate-300 hover:bg-slate-900') + '"><span class="text-lg leading-none">' + i.icon + '</span>' + i.label + '</button>'
      ).join('');
    }

    function selectOptions(list, selected, placeholder) {
      return (placeholder != null ? '<option value="">' + esc(placeholder) + '</option>' : '') +
        list.map(x => '<option value="' + esc(x.id) + '"' + (x.id === selected ? ' selected' : '') + '>' + esc(x.name) + '</option>').join('');
    }

    function renderQuizView() {
      const subjects = state.subjects;
      const topics = state.topics.filter(t => !state.selectedSubjectId || t.subject_id === state.selectedSubjectId);
      const list = filteredQuestions();
      const q = currentQuestion();
      const st = sessionStats();
      const pct = st.total ? Math.round(((st.correct + st.wrong) / st.total) * 100) : 0;

      let html = '<section class="app-card rounded-3xl p-4 sm:p-5 space-y-3">' +
        '<div class="flex flex-wrap items-center justify-between gap-2">' +
        '<div class="flex items-center gap-2"><h1 class="text-lg font-black lemon-title">📝 Test ishlash</h1>' +
        '<button type="button" data-act="shuffle" class="tactile-btn px-2.5 py-1 rounded-xl bg-slate-900 text-sky-200 border border-slate-700 text-[11px] font-black" title="Savollarni aralashtirish">🔀 Aralashtirish</button>' +
        (!state.examMode
          ? '<button type="button" data-act="start-exam" class="tactile-btn px-2.5 py-1 rounded-xl bg-amber-950/80 text-amber-200 border border-amber-400/40 text-[11px] font-black">⏱️ Imtihon rejimi</button>'
          : '<button type="button" data-act="stop-exam" class="tactile-btn px-2.5 py-1 rounded-xl bg-rose-950/80 text-rose-200 border border-rose-400/40 text-[11px] font-black">⏹️ Yakunlash</button>') +
        '</div>' +
        '<div class="flex gap-1.5 text-[11px] font-black">' +
        '<span class="lemon-pill px-2.5 py-1 rounded-full">✅ ' + st.correct + '</span>' +
        '<span class="px-2.5 py-1 rounded-full bg-rose-950/70 text-rose-200 border border-rose-400/35">❌ ' + st.wrong + '</span>' +
        '<span class="px-2.5 py-1 rounded-full bg-slate-900 text-slate-300 border border-slate-700">⏳ ' + st.left + '</span></div></div>' +
        '<div class="grid sm:grid-cols-2 gap-2.5">' +
        '<select data-change="subject" aria-label="Fan" class="field">' + selectOptions(subjects, state.selectedSubjectId, 'Barcha fanlar (' + state.questions.length + ' savol)') + '</select>' +
        '<select data-change="topic" aria-label="Mavzu" class="field">' + selectOptions(topics, state.selectedTopicId, 'Barcha mavzular') + '</select></div>' +
        '<div class="h-2 rounded-full bg-slate-900 overflow-hidden border border-slate-800"><div class="h-full lemon-btn transition-all duration-300" style="width:' + pct + '%"></div></div>' +
        '</section>';

      if (!q) {
        html += '<section class="app-card rounded-3xl p-8 text-center space-y-3">' +
          '<div class="text-4xl">' + (state.loading ? '⏳' : '📭') + '</div>' +
          '<p class="text-sm font-bold text-slate-200">' + esc(state.loading ? 'Yuklanmoqda...' : (state.statusMessage || 'Bu filtr bo\'yicha savol topilmadi.')) + '</p>' +
          (!state.supabaseClient ? '<button type="button" data-act="auth" class="lemon-btn px-4 py-2 rounded-xl text-xs font-black">🔐 Ulanish</button>' : '') +
          '</section>';
        return html;
      }

      const done = state.answers[q.id];
      const draftId = state.draftSelections[q.id];
      const opts = state.shuffledOptionsMap[q.id] || q.options;
      const img = safeUrl(q.image_url);
      const subjObj = state.subjects.find(x => x.id === q.subject_id);

      html += '<section class="app-card rounded-3xl p-4 sm:p-6 space-y-4">' +
        '<div class="flex flex-wrap items-center justify-between gap-2 text-[11px] font-black text-slate-400">' +
        '<span>Savol ' + (state.activeQuestionIndex + 1) + ' / ' + list.length + (subjObj ? ' • <span class="text-sky-300">' + esc(subjObj.name) + '</span>' : '') + '</span>' +
        (done ? '<span class="' + (done.correct ? 'text-lime-300' : 'text-rose-300') + '">' + (done.correct ? '✅ Tasdiqlangan' : '❌ Urinishlar: ' + done.attemptsCount) + '</span>' : '') + '</div>' +
        '<h2 class="text-base sm:text-lg font-extrabold leading-relaxed" style="color:var(--text-primary)">' + esc(q.prompt) + '</h2>' +
        (img ? '<img src="' + esc(img) + '" alt="Savol rasmi" loading="lazy" referrerpolicy="no-referrer" class="max-h-64 rounded-2xl border border-slate-700 object-contain" onerror="this.style.display=\'none\'" />' : '') +
        '<div class="grid gap-2.5" role="radiogroup">' +
        opts.map((o, i) => {
          const isDraft = draftId === o.id;
          const isChecked = done && done.answerId === o.id;
          let cls = 'bg-slate-950/70 border-slate-700 text-slate-100';
          let mark = String.fromCharCode(65 + i);

          if (isChecked && (!isDraft || isDraft === o.id)) {
            cls = done.correct ? 'bg-emerald-950/80 border-lime-300/80 text-lime-100' : 'bg-rose-950/80 border-rose-400/70 text-rose-100';
            mark = done.correct ? '✓' : '✕';
          } else if (isDraft) {
            cls = 'bg-lime-300/15 border-lime-300/70 text-lime-100';
          }

          return '<button type="button" role="radio" aria-checked="' + (isDraft ? 'true' : 'false') + '" data-act="pick" data-id="' + esc(o.id) + '"' +
            (done && done.correct ? ' disabled' : '') +
            ' class="opt-btn flex items-center gap-3 text-left px-4 py-3 rounded-2xl border text-sm font-semibold ' + cls + '">' +
            '<span class="w-7 h-7 shrink-0 rounded-lg bg-slate-900 border border-slate-600 flex items-center justify-center text-xs font-black">' + mark + '</span>' +
            '<span class="flex-1">' + esc(o.label) + '</span></button>';
        }).join('') + '</div>' +
        (done && done.correct && done.explanation
          ? '<div class="p-3.5 rounded-2xl bg-emerald-950/50 border border-lime-300/30 text-xs text-lime-100 leading-relaxed"><strong class="text-lime-300">💡 Izoh:</strong> ' + esc(done.explanation) + '</div>'
          : '') +
        '<div class="flex flex-wrap items-center gap-2 pt-1">' +
        '<button type="button" data-act="prev" class="tactile-btn px-4 py-2.5 rounded-xl bg-slate-900 text-slate-200 border border-slate-700 text-xs font-black"' + (state.activeQuestionIndex === 0 ? ' disabled' : '') + '>← Oldingi</button>' +
        '<button type="button" data-act="verify" class="lemon-btn flex-1 min-w-[140px] py-2.5 rounded-xl text-xs font-black"' +
        ((!draftId || state.verifyingAnswer || (done && done.correct)) ? ' disabled' : '') + '>' +
        (state.verifyingAnswer ? '<span class="spinner"></span> Tekshirilmoqda...' : '🔎 Javobni tekshirish') + '</button>' +
        '<button type="button" data-act="next" class="tactile-btn px-4 py-2.5 rounded-xl bg-slate-900 text-slate-200 border border-slate-700 text-xs font-black"' + (state.activeQuestionIndex >= list.length - 1 ? ' disabled' : '') + '>Keyingi →</button></div>' +
        '<p class="text-[11px] text-slate-500">Yorliqlar: 1–6 variant, Enter tekshirish, ← → savollar.</p>' +
        '</section>';

      html += '<section class="app-card rounded-3xl p-4"><div class="flex flex-wrap gap-1.5">' +
        list.map((x, i) => {
          const a = state.answers[x.id];
          const c = i === state.activeQuestionIndex ? 'lemon-btn' :
            a ? (a.correct ? 'bg-emerald-950/80 text-lime-200 border-lime-300/50' : 'bg-rose-950/80 text-rose-200 border-rose-400/50') :
            'bg-slate-950/80 text-slate-300 border-slate-700';
          return '<button type="button" data-act="goto" data-i="' + i + '" class="tactile-btn w-9 h-9 rounded-xl border text-xs font-black ' + c + '">' + (i + 1) + '</button>';
        }).join('') + '</div></section>';

      return html;
    }

      const subjectBreakdown = state.subjects.map(s => {
        const qs = state.questions.filter(q => q.subject_id === s.id);
        const ok = qs.filter(q => state.answers[q.id] && state.answers[q.id].correct).length;
        return { name: s.name, total: qs.length, ok, pct: qs.length ? Math.round((ok / qs.length) * 100) : 0 };
      }).filter(x => x.total > 0);

      let html = '<section class="app-card rounded-3xl p-5 space-y-4">' +
        '<div class="flex items-center justify-between"><h1 class="text-lg font-black lemon-title">📊 Joriy sessiya natijalari</h1>' +
        '<span class="lemon-pill px-3 py-1 rounded-full text-xs font-black">Natija: ' + scorePct + '%</span></div>' +
        '<div class="grid grid-cols-3 gap-2.5 text-center">' +
        '<div class="rounded-2xl bg-slate-950/70 border border-slate-800 p-3"><div class="text-2xl font-black text-lime-300">' + st.correct + '</div><div class="text-[11px] text-slate-400 font-bold">To\'g\'ri</div></div>' +
        '<div class="rounded-2xl bg-slate-950/70 border border-slate-800 p-3"><div class="text-2xl font-black text-rose-300">' + st.wrong + '</div><div class="text-[11px] text-slate-400 font-bold">Xato</div></div>' +
        '<div class="rounded-2xl bg-slate-950/70 border border-slate-800 p-3"><div class="text-2xl font-black text-sky-300">' + st.left + '</div><div class="text-[11px] text-slate-400 font-bold">Qolgan</div></div></div>' +
        (subjectBreakdown.length ? '<div class="space-y-2.5 pt-2 border-t border-slate-800"><div class="text-xs font-black text-slate-300">Fanlar bo\'yicha ko\'rsatkich:</div>' +
          subjectBreakdown.map(sb => '<div><div class="flex justify-between text-[11px] font-bold mb-1"><span>' + esc(sb.name) + '</span><span class="text-lime-300">' + sb.ok + '/' + sb.total + ' (' + sb.pct + '%)</span></div>' +
          '<div class="h-1.5 rounded-full bg-slate-900 overflow-hidden"><div class="h-full lemon-btn" style="width:' + sb.pct + '%"></div></div></div>').join('') + '</div>' : '') +
        '<div class="flex gap-2"><button type="button" data-act="reset-session" class="tactile-btn px-4 py-2 rounded-xl bg-slate-900 text-lime-300 border border-lime-300/35 text-xs font-black">🔄 Sessiyani nollash</button></div></section>';

        html += '<p class="text-xs text-slate-300">Barcha urinishlaringizni bazada saqlash va ko\'rish uchun tizimga kiring.</p><button type="button" data-act="auth" class="lemon-btn px-4 py-2 rounded-xl text-xs font-black">🔐 Kirish</button>';
      } else if (state.history === null) {
        html += '<p class="text-xs text-slate-300"><span class="spinner" style="border-color:rgba(190,242,100,.3);border-top-color:#bef264"></span> Yuklanmoqda...</p>';
      } else if (!state.history.length) {
        html += '<p class="text-xs text-slate-300">Hozircha bazada urinishlar qayd etilmagan.</p>';
      } else {
        const total = state.history.length;
        const ok = state.history.filter(h => h.is_correct).length;
        const uniq = new Set(state.history.map(h => h.question_id)).size;
        html += '<div class="grid grid-cols-3 gap-2.5 text-center">' +
          '<div class="rounded-2xl bg-slate-950/70 border border-slate-800 p-3"><div class="text-xl font-black text-sky-300">' + total + '</div><div class="text-[11px] text-slate-400 font-bold">Jami urinish</div></div>' +
          '<div class="rounded-2xl bg-slate-950/70 border border-slate-800 p-3"><div class="text-xl font-black text-lime-300">' + Math.round(ok / total * 100) + '%</div><div class="text-[11px] text-slate-400 font-bold">Aniqlik</div></div>' +
          '<div class="rounded-2xl bg-slate-950/70 border border-slate-800 p-3"><div class="text-xl font-black text-amber-300">' + uniq + '</div><div class="text-[11px] text-slate-400 font-bold">Ishlangan savol</div></div></div>';
      }
      return html + '</section>';
    }

    function render403() {
      return '<section class="app-card rounded-3xl p-10 text-center space-y-3 max-w-xl mx-auto">' +
        '<div class="text-6xl font-black text-rose-300">403</div>' +

      let html = '<section class="app-card rounded-3xl p-4 flex flex-wrap items-center justify-between gap-2">' +
        '<div class="flex flex-wrap items-center gap-2"><h1 class="text-lg font-black lemon-title mr-2">🛠️ Admin Boshqaruv</h1>' +

          (state.adminTab === t[0] ? 'lemon-btn' : 'bg-slate-950/80 text-slate-200 border-slate-600/60') + '">' + t[1] + '</button>').join('') + '</div>' +
        '<button type="button" data-act="export-json" class="tactile-btn px-3 py-1.5 rounded-xl bg-slate-900 text-sky-200 border border-slate-700 text-xs font-black">📥 JSON Zaxira</button></section>';

      if (state.adminTab === 'subjects') {
        html += '<section class="app-card rounded-3xl p-5 space-y-4">' +
          '<form data-form="subject" class="flex gap-2"><input name="name" required maxlength="120" placeholder="Yangi fan nomi (masalan: Matematika)" class="field" />' +
          '<button class="lemon-btn px-4 rounded-xl text-xs font-black shrink-0">➕ Qo\'shish</button></form>' +
          '<ul class="divide-y divide-slate-800">' +
          (state.subjects.map(s => '<li class="flex items-center justify-between py-2.5 text-sm"><span class="font-bold">' + esc(s.name) + '</span>' +
            '<button type="button" data-act="del-subject" data-id="' + esc(s.id) + '" class="tactile-btn px-3 py-1.5 rounded-xl bg-rose-950/80 text-rose-200 border border-rose-500/35 text-[11px] font-black">🗑️ O\'chirish</button></li>').join('') ||
            '<li class="py-3 text-xs text-slate-400">Fanlar yo\'q.</li>') + '</ul></section>';
      }

      if (state.adminTab === 'topics') {
        html += '<section class="app-card rounded-3xl p-5 space-y-4">' +
          '<form data-form="topic" class="grid sm:grid-cols-[1fr_1fr_auto] gap-2">' +
          '<select name="subject_id" required class="field">' + selectOptions(state.subjects, '', 'Fanni tanlang') + '</select>' +
          '<input name="name" required maxlength="120" placeholder="Yangi mavzu nomi" class="field" />' +
          '<button class="lemon-btn px-4 py-2.5 rounded-xl text-xs font-black">➕ Qo\'shish</button></form>' +
          '<ul class="divide-y divide-slate-800">' +
          (state.topics.map(t => {
            const s = state.subjects.find(x => x.id === t.subject_id);
            return '<li class="flex items-center justify-between py-2.5 text-sm"><span><span class="font-bold">' + esc(t.name) + '</span> <span class="text-slate-400 text-xs">· ' + esc(s ? s.name : '—') + '</span></span>' +
              '<button type="button" data-act="del-topic" data-id="' + esc(t.id) + '" class="tactile-btn px-3 py-1.5 rounded-xl bg-rose-950/80 text-rose-200 border border-rose-500/35 text-[11px] font-black">🗑️ O\'chirish</button></li>';
          }).join('') || '<li class="py-3 text-xs text-slate-400">Mavzular yo\'q.</li>') + '</ul></section>';
      }

      if (state.adminTab === 'questions') {
        const d = state.editingDraft;
        const dTopics = state.topics.filter(t => t.subject_id === d.subject_id);
        const qList = state.questions.filter(q => !state.adminSearch || q.prompt.toLowerCase().includes(state.adminSearch.toLowerCase()));

        html += '<section class="app-card rounded-3xl p-5 space-y-3">' +
          '<div class="flex items-center justify-between"><h2 class="text-base font-black lemon-title">' + (state.editingQuestionId ? '✏️ Savolni tahrirlash' : '➕ Yangi savol qo\'shish') + '</h2>' +
          (state.editingQuestionId ? '<button type="button" data-act="cancel-edit" class="tactile-btn px-3 py-1.5 rounded-xl bg-slate-900 text-slate-200 border border-slate-700 text-[11px] font-black">Bekor qilish</button>' : '') + '</div>' +
          '<form data-form="question" class="space-y-3">' +
          '<div class="grid sm:grid-cols-2 gap-2.5">' +
          '<select data-input="subject_id" required class="field">' + selectOptions(state.subjects, d.subject_id, 'Fanni tanlang') + '</select>' +
          '<select data-input="topic_id" class="field">' + selectOptions(dTopics, d.topic_id, 'Mavzusiz') + '</select></div>' +
          '<textarea data-input="prompt" required maxlength="2000" rows="3" placeholder="Savol matni" class="field">' + esc(d.prompt) + '</textarea>' +
          '<div class="grid sm:grid-cols-2 gap-2.5">' +
          '<input data-input="image_url" type="url" placeholder="Rasm URL (ixtiyoriy, https://...)" value="' + esc(d.image_url) + '" class="field" />' +
          '<input data-input="explanation" maxlength="1000" placeholder="Izoh / Yechim (to\'g\'ri topganda ko\'rinadi)" value="' + esc(d.explanation) + '" class="field" /></div>' +
          '<div class="text-[11px] font-black text-lime-300">Variantlar (to\'g\'ri javobni radio tugma bilan belgilang):</div>' +
          d.options.map((o, i) => '<div class="flex items-center gap-2">' +
            '<input type="radio" name="correct" data-correct="' + esc(o.id) + '"' + (d.correct_answer_id === o.id ? ' checked' : '') + ' class="accent-lime-400 w-4 h-4" />' +
            '<input data-opt="' + i + '" required maxlength="500" value="' + esc(o.label) + '" placeholder="Variant ' + String.fromCharCode(65 + i) + '" class="field" />' +
            '<button type="button" data-act="rm-opt" data-i="' + i + '" class="tactile-btn px-2.5 py-2 rounded-xl bg-slate-900 text-rose-300 border border-slate-700 text-xs font-black"' + (d.options.length <= MIN_OPTIONS ? ' disabled' : '') + '>✕</button></div>').join('') +
          '<div class="flex flex-wrap gap-2 pt-1">' +
          '<button type="button" data-act="add-opt" class="tactile-btn px-3.5 py-2 rounded-xl bg-slate-900 text-lime-300 border border-lime-300/35 text-xs font-black"' + (d.options.length >= MAX_OPTIONS ? ' disabled' : '') + '>➕ Variant</button>' +
          '<button class="lemon-btn flex-1 min-w-[140px] py-2.5 rounded-xl text-xs font-black">💾 Serverga Saqlash (RPC)</button></div></form></section>';

        html += '<section class="app-card rounded-3xl p-5 space-y-3">' +
          '<div class="flex flex-wrap items-center justify-between gap-2"><h2 class="text-base font-black lemon-title">Barcha savollar (' + qList.length + ')</h2>' +
          '<input data-search="admin-q" value="' + esc(state.adminSearch) + '" placeholder="🔍 Savol matni bo\'yicha qidirish..." class="field sm:max-w-xs" /></div>' +
          '<ul class="divide-y divide-slate-800">' +
          (qList.map(q => {
            const s = state.subjects.find(x => x.id === q.subject_id);
            return '<li class="py-3 flex items-start justify-between gap-3"><div class="min-w-0"><div class="text-sm font-bold break-words">' + esc(q.prompt.length > 130 ? q.prompt.slice(0, 130) + '…' : q.prompt) + '</div>' +
              '<div class="text-[11px] text-slate-400">' + esc(s ? s.name : '—') + ' · ' + q.options.length + ' variant</div></div>' +
              '<div class="flex gap-1.5 shrink-0"><button type="button" data-act="edit-q" data-id="' + esc(q.id) + '" class="tactile-btn px-3 py-1.5 rounded-xl bg-slate-900 text-lime-300 border border-lime-300/35 text-[11px] font-black">✏️</button>' +
              '<button type="button" data-act="del-q" data-id="' + esc(q.id) + '" class="tactile-btn px-3 py-1.5 rounded-xl bg-rose-950/80 text-rose-200 border border-rose-500/35 text-[11px] font-black">🗑️</button></div></li>';
          }).join('') || '<li class="py-3 text-xs text-slate-400">Savollar topilmadi.</li>') + '</ul></section>';
      }
      return html;
    }

    function renderMain() {
      const main = $('prod-main-view');
      if (!main) return;
      let html;
      if (state.view === 'admin') html = renderAdminView();
      else if (state.view === 'results') html = renderResultsView();
      else html = renderQuizView();
      main.innerHTML = html;
      if (window.gsap) gsap.fromTo(main.children, { y: 6, opacity: 0 }, { y: 0, opacity: 1, duration: 0.2, stagger: 0.03, clearProps: 'all' });
    }

    function renderApp() {
      renderNav();
      renderMain();
      renderDock();
      updateNetworkBadge();
      updateJwtBanner();
    }

    function navigate(view) {
      state.view = view;
      if (view === 'results' && state.history === null && state.session) loadHistory();
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function openAuthSheet() {
      const s = $('jwt-auth-sheet');
      s.classList.remove('hidden'); s.classList.add('flex');
      if (state.supabaseUrl) $('supa-project-url').value = state.supabaseUrl;
      if (state.supabaseAnonKey) $('supa-project-anon').value = state.supabaseAnonKey;
    }
    function closeAuthSheet() {
      const s = $('jwt-auth-sheet');
      s.classList.add('hidden'); s.classList.remove('flex');
    }
    async function toggleSoftDayMode() {
      state.softDayMode = !state.softDayMode;
      document.body.classList.toggle('soft-day-mode', state.softDayMode);
      await idbSet('ui_soft_day', state.softDayMode);
    }

    async function connectSupabaseProject(e) {
      e.preventDefault();
      const ok = await initSupabaseClient($('supa-project-url').value, $('supa-project-anon').value);
      if (ok) {
        await syncCatalogFromSupabase();
        closeAuthSheet();
        notify('Supabase muvaffaqiyatli ulandi.', 'success');
      }
      renderApp();
    }
    async function submitJwtLogin(e) {
      e.preventDefault();
      if (!state.supabaseClient) return notify('Avval Supabase loyihasini ulang.', 'warn');
      const { error } = await state.supabaseClient.auth.signInWithPassword({
        email: $('jwt-login-email').value.trim(),
        password: $('jwt-login-password').value
      });
      if (error) return notify('Kirish xatosi: ' + errMsg(error), 'error');
      $('jwt-login-password').value = '';
      closeAuthSheet();
      notify('Muvaffaqiyatli kirdingiz.', 'success');
    }
    async function signUpJwt() {
      if (!state.supabaseClient) return notify('Avval Supabase loyihasini ulang.', 'warn');
      const email = $('jwt-login-email').value.trim();
      const password = $('jwt-login-password').value;
      if (!email || password.length < 6) return notify('Email va kamida 6 belgili parol kiriting.', 'warn');
      const { data, error } = await state.supabaseClient.auth.signUp({ email, password });
      if (error) return notify('Ro\'yxatdan o\'tish xatosi: ' + errMsg(error), 'error');
      notify(data.session ? 'Akkaunt yaratildi.' : 'Emailingizga tasdiqlash xati yuborildi.', 'success');
    }
    async function logoutJwt() {
      if (!state.supabaseClient) return;
      const { error } = await state.supabaseClient.auth.signOut();
      if (error) return notify('Chiqishda xatolik: ' + errMsg(error), 'error');
      state.answers = {};
      state.draftSelections = {};
      if (state.view === 'admin') state.view = 'quiz';
      notify('Tizimdan chiqdingiz.', 'info');
    }

    function requireAdmin() {
      if (!state.isServerAdmin) { notify('403: admin huquqi yo\'q.', 'error'); state.view = 'admin'; renderApp(); return false; }
      return true;
    }
    async function afterMutation(msg) {
      await syncCatalogFromSupabase();
      notify(msg, 'success');
      renderApp();
    }

    async function adminAddSubject(form) {
      if (!requireAdmin()) return;
      const name = form.elements.name.value.trim();
      if (!name) return;
      const { error } = await state.supabaseClient.from('subjects').insert({ name });
      if (error) return notify(errMsg(error), 'error');
      form.reset();
      afterMutation('Fan qo\'shildi.');
    }
    async function adminAddTopic(form) {
      if (!requireAdmin()) return;
      const name = form.elements.name.value.trim();
      const subject_id = form.elements.subject_id.value;
      if (!name || !subject_id) return;
      const { error } = await state.supabaseClient.from('topics').insert({ name, subject_id });
      if (error) return notify(errMsg(error), 'error');
      afterMutation('Mavzu qo\'shildi.');
    }
    async function adminDelete(table, id, label) {
      if (!requireAdmin()) return;
      const ok = await askConfirm(label + ' o\'chirilsinmi? Bu amalni qaytarib bo\'lmaydi.', 'O\'chirishni tasdiqlang');
      if (!ok) return;
      const { error } = await state.supabaseClient.from(table).delete().eq('id', id);
      if (error) return notify(errMsg(error), 'error');
      afterMutation('O\'chirildi.');
    }

    async function adminEditQuestion(id) {
      if (!requireAdmin()) return;
      const q = state.questions.find(x => x.id === id);
      if (!q) return;
      const { data, error } = await state.supabaseClient.rpc('admin_get_correct_answer', { p_question_id: id });
      if (error) return notify(errMsg(error), 'error');

      const correctId = (data && typeof data === 'object') ? data.correct_answer_id : data;
      const explanation = (data && typeof data === 'object') ? (data.explanation || '') : '';

      state.editingQuestionId = id;
      state.editingDraft = {
        subject_id: q.subject_id,
        topic_id: q.topic_id || '',
        prompt: q.prompt,
        image_url: q.image_url || '',
        explanation: explanation,
        options: q.options.map(o => ({ id: o.id, label: o.label })),
        correct_answer_id: correctId || (q.options[0] && q.options[0].id) || ''
      };
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function adminSaveQuestion() {
      if (!requireAdmin()) return;
      const d = state.editingDraft;
      const labels = d.options.map(o => o.label.trim());
      if (!d.subject_id) return notify('Fanni tanlang.', 'warn');
      if (!d.prompt.trim()) return notify('Savol matnini kiriting.', 'warn');
      if (labels.some(l => !l)) return notify('Barcha variantlarni to\'ldiring.', 'warn');
      if (new Set(labels.map(l => l.toLowerCase())).size !== labels.length) return notify('Variantlar takrorlanmasligi kerak.', 'warn');
      if (!d.options.some(o => o.id === d.correct_answer_id)) return notify('To\'g\'ri javobni belgilang.', 'warn');
      if (d.image_url.trim() && !safeUrl(d.image_url)) return notify('Rasm URL noto\'g\'ri.', 'warn');

      const { error } = await state.supabaseClient.rpc('admin_save_question', {
        p_id: state.editingQuestionId,
        p_subject_id: d.subject_id,
        p_topic_id: d.topic_id || null,
        p_prompt: d.prompt.trim(),
        p_image_url: safeUrl(d.image_url) || null,
        p_options: d.options.map((o, i) => ({ id: o.id, label: labels[i] })),
        p_correct_id: d.correct_answer_id,
        p_explanation: d.explanation.trim() || null
      });
      if (error) return notify(errMsg(error), 'error');
      const sid = d.subject_id, tid = d.topic_id;
      state.editingQuestionId = null;
      state.editingDraft = blankDraft(sid, tid);
      afterMutation('Savol bazaga saqlandi.');
    }

    function exportBackupJson() {
      const payload = {
        exported_at: new Date().toISOString(),
        subjects: state.subjects,
        topics: state.topics,
        questions: state.questions
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'bilimxona-backup-' + new Date().toISOString().slice(0, 10) + '.json';
      a.click();
      URL.revokeObjectURL(url);
      notify('📥 JSON zaxira fayli yuklab olindi.', 'success');
    }

    document.addEventListener('click', e => {
      const el = e.target.closest('[data-act]');
      if (!el || el.disabled) return;
      const act = el.dataset.act;
      switch (act) {
        case 'nav': navigate(el.dataset.view); break;
        case 'auth': openAuthSheet(); break;
        case 'theme': toggleSoftDayMode(); break;
        case 'shuffle': shuffleSession(); break;
        case 'start-exam': startExamMode(); break;
        case 'stop-exam': stopExamMode(false); break;
        case 'pick': pickAnswer(el.dataset.id); break;
        case 'verify': verifyCurrent(); break;
        case 'prev': goToQuestion(state.activeQuestionIndex - 1); break;
        case 'next': goToQuestion(state.activeQuestionIndex + 1); break;
        case 'goto': goToQuestion(parseInt(el.dataset.i, 10)); break;
        case 'reset-session':
          state.answers = {}; state.draftSelections = {};
          notify('Sessiya nollandi.', 'info'); renderApp(); break;
        case 'admin-tab': state.adminTab = el.dataset.tab; renderApp(); break;
        case 'export-json': exportBackupJson(); break;
        case 'del-subject': adminDelete('subjects', el.dataset.id, 'Fan va unga tegishli savollar'); break;
        case 'del-topic': adminDelete('topics', el.dataset.id, 'Mavzu'); break;
        case 'del-q': adminDelete('questions', el.dataset.id, 'Savol'); break;
        case 'edit-q': adminEditQuestion(el.dataset.id); break;
        case 'cancel-edit': state.editingQuestionId = null; state.editingDraft = blankDraft(); renderApp(); break;
        case 'add-opt':
          if (state.editingDraft.options.length < MAX_OPTIONS) { state.editingDraft.options.push({ id: uuid(), label: '' }); renderApp(); }
          break;
        case 'rm-opt': {
          const d = state.editingDraft, i = parseInt(el.dataset.i, 10);
          if (d.options.length > MIN_OPTIONS) {
            const [rm] = d.options.splice(i, 1);
            if (rm && rm.id === d.correct_answer_id) d.correct_answer_id = d.options[0].id;
            renderApp();
          }
          break;
        }
      }
    });

    document.addEventListener('change', e => {
      const t = e.target;
      if (t.dataset.change === 'subject') {
        state.selectedSubjectId = t.value; state.selectedTopicId = '';
        state.activeQuestionIndex = 0; renderApp();
      } else if (t.dataset.change === 'topic') {
        state.selectedTopicId = t.value; state.activeQuestionIndex = 0; renderApp();
      } else if (t.dataset.input === 'subject_id') {
        state.editingDraft.subject_id = t.value; state.editingDraft.topic_id = ''; renderApp();
      } else if (t.dataset.input === 'topic_id') {
        state.editingDraft.topic_id = t.value;
      } else if (t.dataset.correct) {
        state.editingDraft.correct_answer_id = t.dataset.correct;
      }
    });

    document.addEventListener('input', e => {
      const t = e.target, d = state.editingDraft;
      if (t.dataset.input === 'prompt') d.prompt = t.value;
      else if (t.dataset.input === 'image_url') d.image_url = t.value;
      else if (t.dataset.input === 'explanation') d.explanation = t.value;
      else if (t.dataset.opt !== undefined) { const o = d.options[parseInt(t.dataset.opt, 10)]; if (o) o.label = t.value; }
      else if (t.dataset.search === 'admin-q') {
        state.adminSearch = t.value;
        renderApp();
        const inp = document.querySelector('[data-search="admin-q"]');
        if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
      }
    });

    document.addEventListener('submit', e => {
      const f = e.target.closest('[data-form]');
      if (!f) return;
      e.preventDefault();
      if (f.dataset.form === 'subject') adminAddSubject(f);
      else if (f.dataset.form === 'topic') adminAddTopic(f);
      else if (f.dataset.form === 'question') adminSaveQuestion();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') return closeAuthSheet();
      const tag = (e.target.tagName || '').toLowerCase();
      if (['input', 'textarea', 'select'].includes(tag) || e.target.isContentEditable) return;
      if (state.view !== 'quiz' || !$('jwt-auth-sheet').classList.contains('hidden')) return;
      const q = currentQuestion();
      if (!q) return;
      const opts = state.shuffledOptionsMap[q.id] || q.options;
      if (/^[1-9]$/.test(e.key)) { const o = opts[parseInt(e.key, 10) - 1]; if (o) pickAnswer(o.id); }
      else if (e.key === 'Enter') verifyCurrent();
      else if (e.key === 'ArrowRight') goToQuestion(state.activeQuestionIndex + 1);
      else if (e.key === 'ArrowLeft') goToQuestion(state.activeQuestionIndex - 1);
    });

    window.addEventListener('online', async () => {
      updateNetworkBadge();
      if (state.supabaseClient) { await syncCatalogFromSupabase(); renderApp(); }
    });
    window.addEventListener('offline', () => { updateNetworkBadge(); notify('Offline rejim: keshlangan savollar ko\'rsatiladi.', 'warn'); });
    $('jwt-auth-sheet').addEventListener('click', e => { if (e.target.id === 'jwt-auth-sheet') closeAuthSheet(); });

    window.BilimXonaProd = {
      navigate, openAuthSheet, closeAuthSheet, toggleSoftDayMode,
      connectSupabaseProject, submitJwtLogin, signUpJwt, logoutJwt
    };

    (async function boot() {
      renderApp();
      const soft = await idbGet('ui_soft_day');
      if (soft) { state.softDayMode = true; document.body.classList.add('soft-day-mode'); }

      const cfg = await idbGet('supabase_config');
      let connected = false;
      if (cfg && cfg.url && cfg.anonKey) connected = await initSupabaseClient(cfg.url, cfg.anonKey);

      if (connected) {
        await syncCatalogFromSupabase();
      } else {
        const had = await loadCatalogFromCache();
        state.statusMessage = had ? 'Saqlangan nusxa ko\'rsatilmoqda. Yangilash uchun Supabase\'ga ulaning.' : 'Supabase loyihasini ulang yoki JWT sessiyani faollashtiring.';
        if (!cfg) setTimeout(openAuthSheet, 400);
      }
      renderApp();
    })();
  })();
  </script>
</body>
  </html>
